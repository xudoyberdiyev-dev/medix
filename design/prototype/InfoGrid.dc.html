<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 1px 2px rgba(18,60,58,0.04);font-family:Inter,system-ui,sans-serif;color:#172B2A">
  <div style="padding:14px 20px;border-bottom:1px solid #EEF2F4;font-size:14px;line-height:20px;font-weight:600">{{ title }}</div>
  <div style="padding:8px 20px 12px;display:flex;flex-direction:column">
    <sc-for list="{{ items }}" as="r" hint-placeholder-count="4">
      <div style="display:flex;flex-wrap:wrap;gap:2px 16px;padding:8px 0;border-bottom:{{ r.sep }}">
        <span style="flex:0 0 {{ labelW }};font-size:12px;line-height:20px;color:#5B6B6A">{{ r.label }}</span>
        <span style="flex:1 1 160px;min-width:0;font-size:{{ r.size }};line-height:20px;color:{{ r.color }};font-family:{{ r.font }};overflow-wrap:anywhere">{{ r.value }}</span>
      </div>
    </sc-for>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:560,&quot;height&quot;:280},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Asosiy ma'lumot&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label,value,mono?}[]&quot;},&quot;stacked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const rows = this.props.rows || [];
    return { labelW: this.props.stacked ? '100%' : '180px', items: rows.map((r, i) => {
      const empty = r.value == null || r.value === '';
      return { label: r.label, value: empty ? '—' : r.value, color: empty ? '#647574' : '#172B2A', font: r.mono && !empty ? "'JetBrains Mono',monospace" : 'inherit', size: r.mono && !empty ? '12.5px' : '14px', sep: i < rows.length - 1 ? '1px solid #EEF2F4' : '0' };
    }) };
  }
}
</script>
</body>
</html>
