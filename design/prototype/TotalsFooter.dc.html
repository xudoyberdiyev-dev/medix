<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:sticky;bottom:{{ bottom }}px;z-index:4;display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:8px 28px;min-height:52px;padding:10px 20px;background:#F8FAFA;border-top:1px solid #E2E8F0;border-radius:0 0 10px 10px;font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums">
  <sc-for list="{{ items }}" as="t" hint-placeholder-count="4">
    <span style="display:flex;align-items:baseline;gap:6px;font-size:13px;line-height:18px;white-space:nowrap"><span style="color:#5B6B6A">{{ t.label }}</span><span style="color:#172B2A;font-weight:500">{{ t.value }}</span></span>
  </sc-for>
  <span style="display:flex;align-items:baseline;gap:8px;white-space:nowrap;padding-left:20px;border-left:1px solid #E2E8F0"><span style="font-size:13px;color:#5B6B6A">{{ totalLabel }}</span><span style="font-size:16px;line-height:22px;font-weight:600;color:#172B2A">{{ totalValue }}</span></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:80},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label,value}[]&quot;},&quot;totalLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Jami:&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;totalValue&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;45.200.000,00&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;bottom&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:-24,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() { return { items: this.props.items || [], totalValue: this.props.totalValue != null ? this.props.totalValue : '', totalLabel: this.props.totalLabel || '', bottom: this.props.bottom != null ? this.props.bottom : -24 }; }
}
</script>
</body>
</html>
