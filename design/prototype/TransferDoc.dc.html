<!DOCTYPE html>
<html>
<head>

<x-dc>
<helmet><script src="medix-data.js"></script></helmet>
<div data-screen-label="{{ screenLabel }}" style="display:flex;flex-direction:column;gap:16px;min-width:0;font-family:Inter,system-ui,sans-serif;color:#172B2A;font-size:14px;line-height:20px;font-variant-numeric:tabular-nums">
  <dc-import name="DocumentHeader" print-items="{{ printItems }}" print-label="{{ L.ch_printMenu }}" parent-label="{{ L.kc_title }}" on-parent="{{ back }}" title="{{ title }}" number="{{ dNumber }}" badge="{{ dBadge }}" status="{{ dStatus }}" steps="{{ dSteps }}" sub="{{ dSub }}" autosave="{{ autosave }}" primary="{{ dPrimary }}" secondary="{{ dSecondary }}" more="{{ dMore }}" more-label="{{ L.p_more }}" hint-size="100%,88px"></dc-import>

  </sc-if>

        <div style="display:flex;gap:12px;align-items:flex-start">
          <span style="width:32px;height:32px;flex:none;border-radius:50%;background:#FEF2F2;color:#B91C1C;display:flex;align-items:center;justify-content:center"><lucide-i name="ban" size="18"></lucide-i></span>

      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;zk&quot;,&quot;ok&quot;,&quot;fs&quot;],&quot;default&quot;:&quot;ok&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;no&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;req&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;act&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;docKey&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;dict&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;keeper&quot;,&quot;branch&quot;,&quot;purchase&quot;,&quot;director&quot;,&quot;admin&quot;,&quot;cashier&quot;,&quot;accountant&quot;],&quot;default&quot;:&quot;keeper&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;branch&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;TSH&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sardor Aliyev&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;narrow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onBack&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onToast&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(t)=&gt;void&quot;},&quot;onReceive&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(no)=&gt;void&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(k,a)=&gt;void&quot;}}">
const fN = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

const fill = (t, o) => String(t || '').replace(/\{(\w+)\}/g, (_, k) => o[k] != null ? o[k] : '');
const pD = s => { const m = /^(\d{2})\.(\d{2})\.(\d{4})/.exec(String(s || '')); return m ? Date.UTC(+m[3], +m[2] - 1, +m[1]) : 0; };
const ST = { draft: ['file-pen', '#5B6B6A', '#F8FAFA'], pending: ['clock', '#B45309', '#FFFBEB'], posted: ['circle-check', '#15803D', '#F0FDF4'], transit: ['truck', '#1D4ED8', '#EFF6FF'], received: ['circle-check', '#15803D', '#F0FDF4'], diff: ['triangle-alert', '#B45309', '#FFFBEB'], rejected: ['octagon-x', '#B91C1C', '#FEF2F2'], cancelled: ['circle-x', '#5B6B6A', '#EEF2F4'] };
const ZICON = { store: 'boxes', ctrl: 'lock-keyhole', cold: 'snowflake', quar: 'shield-alert', recv: 'package-open', ship: 'truck' };
const ini = n => String(n || '').split(' ').map(w => w[0]).join('').slice(0, 2);
const enc = e => e && e.wh ? e.branch + '|' + e.wh : '';
const dec = v => { const [branch, wh] = String(v || '').split('|'); return { branch: branch || '', wh: wh || '' }; };
class Component extends DCLogic {
  state = { x: null, docTab: 'doc', save: null, savedAt: null, tried: false, vs: null, dlg: null, reason: '', reasonErr: '' };
  get D() { return window.MedixData; }
  get L() { return this.props.dict || {}; }
  componentDidMount() {
    if (!this.D) this._p = setInterval(() => { if (this.D) { clearInterval(this._p); this.load(); } }, 60); else this.load();

  }
  componentWillUnmount() { clearInterval(this._p); clearInterval(this._poll); clearTimeout(this._sv); }
  componentDidUpdate(pp) { if (pp.docKey !== this.props.docKey) this.load(); }
  refresh() { const x = this.state.x; if (x && x.no && x.status !== 'draft') { const y = this.D.trByNo(x.no); if (y && JSON.stringify(y) !== JSON.stringify(x)) return this.setState({ x: this.D.trCopy(y) }); } this.forceUpdate(); }
  my() { const b = this.props.branch; return b && b !== 'ALL' ? b : null; }
  toast(t) { this.props.onToast && this.props.onToast(t); }
  who(rs) { const L = this.L; return fill(L.qz_who, { r: rs.map(r => L['r_' + r] || r).join(', ') }); }
  load() {
    const D = this.D, p = this.props; if (!D) return;

    clearTimeout(this._sv);
    this.setState({ x, docTab: 'doc', save: null, savedAt: null, tried: false, vs: null, dlg: null, reason: '', reasonErr: '' }, () => {
      if (!x.no && x.lines.length) this.persist(x);

  }
  blank(kind, req) {
    const D = this.D, me = this.props.userName, at = D.nowStr(), br = this.my() || 'TSH', bs = D.batches(); req = req || {};
    const bids = req.bids || (req.bid ? [req.bid] : []), first = bids.length ? bs.find(b => b.id === bids[0]) : null;
    const from = first ? { branch: first.branch, wh: first.wh } : (req.from || { branch: br, wh: 'Asosiy ombor' });
    const to = kind === 'zk' ? { ...from } : kind === 'ok' ? { branch: from.branch, wh: '' } : { branch: '', wh: '' };
    const x = { kind, no: null, id: null, from, to, date: D.TODAY, note: req.note || '', status: 'draft', vat: D.TR_VAT, lines: [], createdBy: me, createdAt: at, log: [{ kind: 'create', who: me, at }] };
    bids.forEach(id => { const b = bs.find(y => y.id === id); if (b) x.lines.push(this.mkLine(x, b, req.qty != null ? req.qty : (kind === 'zk' ? b.qty - b.reservedQty : D.trFree(b, kind)), req.toZone)); });
    return x;
  }
  mkLine(x, b, q, z) { return { id: 'l' + b.id + '-' + Math.random().toString(36).slice(2, 7), bid: b.id, pid: b.pid, batch: b.batch, exp: b.exp, fromZone: b.zone, cost: b.cost, qty: q || 0, toZone: z != null ? z : this.defTo(x, b), recv: null, reason: '' }; }
  defTo(x, b) {
    const D = this.D, p = b.p || D.prodById(b.pid) || {}, t = x.kind === 'zk' ? x.from : x.to; if (!t || !t.wh) return null;
    if (x.kind === 'zk' && b.days != null && b.days < 0) return 'karantin';
    const z = D.defZone(p, t.branch, t.wh); return x.kind === 'zk' && z === b.zone ? null : z;
  }
  persist(x) {
    if (x.status !== 'draft' || !x.lines.length) return;
    clearTimeout(this._sv); this.setState({ save: 'saving' });
    this._sv = setTimeout(() => { const r = this.D.saveTr(this.state.x); this.setState(s => ({ x: { ...s.x, no: r.no, id: r.id, inv: r.inv }, save: 'saved', savedAt: this.D.nowStr().slice(11) })); }, 400);
  }
  upd(fn) { const x = JSON.parse(JSON.stringify(this.state.x)); fn(x); this.setState({ x }); this.persist(x); }
  whBs(e) { return e && e.wh ? this.D.batches().filter(b => b.branch === e.branch && b.wh === e.wh && b.qty > 0 && b.zoneType !== 'ship') : []; }
  whProd(br, wh, pid) { let q = 0, c = 0, r = 0, a = 0; this.D.batches().forEach(b => { if (b.pid === pid && b.branch === br && b.wh === wh && b.qty > 0) { q += b.qty; c += b.closed || 0; r += b.reservedQty || 0; a += b.avail || 0; } }); return { q, c, r, a }; }
  sim(x2, fn) { const S = this.D.store, old = S.transfers; S.transfers = (old || []).filter(y => y.id !== x2.id).concat([x2]); try { return fn(); } finally { S.transfers = old; } }
  preview(x, target) {
    const D = this.D, L = this.L, x2 = D.trCopy(x); x2.id = x2.id || '__sim'; x2.no = x2.no || '__SIM'; x2.status = target; x2.postedAt = x2.sentAt = D.nowStr();
    const pids = [...new Set(x.lines.filter(l => l.qty > 0 && l.bid).map(l => l.pid))];
    const before = pids.map(pid => this.whProd(x.from.branch, x.from.wh, pid)), after = this.sim(x2, () => pids.map(pid => this.whProd(x.from.branch, x.from.wh, pid)));
    const wn = D.whName(x.from.branch, x.from.wh), items = [];
    pids.forEach((pid, i) => { const pn = (D.prodById(pid) || {}).name, q = x.lines.filter(l => l.pid === pid).reduce((a, l) => a + (l.qty || 0), 0), b = before[i], a = after[i];
      items.push(x.kind === 'zk' ? { icon: 'layers', text: fill(L.kc_cfZk, { w: wn, p: pn, a: fN(b.a), b: fN(a.a), c: fN(b.c), d: fN(a.c) }) } : { icon: 'truck', text: fill(L.kc_cfSend, { w: wn, p: pn, a: fN(b.a), b: fN(a.a), q: fN(q) }) }); });
    if (x.kind !== 'zk') items.push({ icon: 'info', text: fill(L.kc_cfTransit, { to: D.whName(x.to.branch, x.to.wh) }) });
    if (x.kind === 'fs' && this.showSum()) { const s = D.trSum(x); items.push({ icon: 'receipt', text: fill(L.kc_cfInv, { n: x.inv || L.kc_invAuto, a: fM(s.net), r: x.vat, v: fM(s.vat), t: fM(s.total) }) }, { icon: 'hand-coins', text: L.kc_cfDebt }); }
    return items;
  }
  showSum() { const D = this.D, r = this.props.role; return D.can(r, 'special.cost') || D.canR(r, 'TR_ROLES', 'readOnly'); }
  canCost() { return this.D.can(this.props.role, 'special.cost'); }
  tryAct(target) {
    clearTimeout(this._sv); const D = this.D, x = this.state.x, c = D.trCheck(x);
    this.setState({ tried: true });
    if (c.errs.length) return this.setState({ vs: c });

  }

    if (dt === 'hc') dlg = { title: L.kc_dHcT, items: s.dlg.items, confirm: L.kc_resHc, danger: true, run: () => { const d = D.resolveHc(x.no, s.dlg.k, user); this.setState({ dlg: null, x: D.trCopy(D.trByNo(x.no)) }); if (d) this.toast(fill(L.kc_tHc, { n: d.no })); } };
    if (dt === 'back') dlg = { title: L.kc_dBackT, items: s.dlg.items, confirm: L.kc_resBack, danger: false, run: () => { const r = D.resolveBack(x.no, s.dlg.k, user); this.setState({ dlg: null, x: r }); this.toast(L.kc_tBack); } };
    const blockItems = dt === 'block' ? s.dlg.items.map(b => ({ text: fill(L.kc_blockD, { p: (D.prodById(b.pid) || {}).name, b: b.batch, w: zk ? place(x.from) : place(x.to), need: fN(b.need), have: fN(b.have), short: fN(b.need - b.have) }) })) : [];
    // --- steps
    const order = zk ? (needAppr || st === 'pending' ? ['draft', 'pending', 'posted'] : ['draft', 'posted']) : ['draft', 'transit', 'received'];
    const ci = st === 'diff' ? 2 : order.indexOf(st), done = ['posted', 'received', 'diff'].includes(st);
    const dSteps = ['cancelled', 'rejected'].includes(st) ? null : order.map((k, i) => ({ label: k === 'received' && st === 'diff' ? L.kc_st_diff : L['kc_step_' + k], state: i < ci || (done && i === ci) ? 'done' : i === ci ? 'cur' : 'next' }));
    const evs = (x.log || []).slice().reverse(), days = [...new Set(evs.map(e => String(e.at).slice(0, 10)))];
    const histGroups = days.map(day => ({ label: day, items: evs.filter(e => String(e.at).slice(0, 10) === day).map(e => ({ kind: e.kind, initials: ini(e.who), name: e.who, action: L['kc_h_' + e.kind] || e.kind, time: String(e.at).slice(11), changes: e.reason ? [{ label: e.kind === 'hc' ? L.kc_hDoc : L.qt_reasonCancel, to: e.reason }] : [] })) }));
    const S = ST[st], errN = errs.length, noteErr = s.tried ? hdrErr('note') : '';
    return {
      ...base, back, title: x.no ? L['kc_k_' + K] : fill(L.kc_newT, { k: L['kc_k_' + K] }), screenLabel: x.no || L.kc_title, dNumber: x.no || '', dBadge: { label: L['kc_st_' + st], icon: S[0], fg: S[1], bg: S[2] },
      dStatus: ['cancelled', 'rejected'].includes(st) ? 'cancelled' : done ? 'posted' : 'draft', dSteps, dPrimary, dMore, dSecondary, printItems: K === 'fs' && x.no ? D.printItems('fs', x.no, L) : [],
      dSub: [{ text: zk ? place(x.from) : `${place(x.from)} → ${place(x.to)}`, icon: zk ? 'layers' : 'arrow-right-left' }, ...(x.inv ? [{ text: x.inv, icon: 'receipt' }] : [])],
      autosave: st === 'draft' && (x.no || s.save) ? { state: s.save === 'saving' ? 'saving' : 'saved', time: s.savedAt || '', savedLabel: L.qt_saved, savingLabel: L.qt_saving, errorLabel: L.qt_saveErr } : null,
      banners, docTabs: [['doc', L.qt_tabDoc], ['hist', L.qt_tabHist]].map(([k, label]) => ({ label, count: k === 'hist' ? (x.log || []).length : null, active: s.docTab === k, pick: () => this.setState({ docTab: k }) })),
      tabDoc: s.docTab === 'doc', tabHist: s.docTab === 'hist', histGroups, layoutCols: narrow ? 'minmax(0,1fr)' : 'minmax(0,1fr) 280px', sideCols: narrow ? 2 : 1,
      headEditable: editable, headRead: !editable, headCols: narrow ? 2 : 3, headSelects, headInputs, headRows,
      noteLabel: needAppr ? L.kc_noteQc : L.qt_note, noteReq: needAppr, notePh: needAppr ? L.kc_noteQcPh : '', dNote: x.note || '', noteErr, noteBorder: noteErr ? '#B91C1C' : '#E2E8F0', onNote: e => { const v = e.target.value; this.upd(y => { y.note = v; }); },
      hasShort: short.length > 0, shortRows, lineCount: String(x.lines.length), hasErrNote: errN > 0, errNote: fill(L.qt_nErr, { n: errN }),
      editable, gCols: cols, gRows, gOpts, onEdit, addLine, removeLine: id => this.upd(y => { y.lines = y.lines.filter(l => l.id !== id); }), onBarcode: () => { this.toast(L.kc_tScanLater); return true; },
      gLabels: { add: L.qt_addLine, empty: L.kc_gEmpty, scanPh: L.qt_scanPh, remove: L.qt_removeLine, search: L.qt_search, keys: '' }, sideKpis,
      vsOpen: !!s.vs, vsTitle: s.vs ? fill(L.qt_vsTitle, { n: s.vs.errs.length }) : '', closeVs: () => this.setState({ vs: null }), vsErrors: s.vs ? s.vs.errs.map(e => ({ text: e.text, go: () => this.setState({ vs: null }) })) : [], vsWarnings: [],
      dlgOpen: !!dlg, dlg: dlg || {}, closeDlg: () => this.setState({ dlg: null }), reason: s.reason, reasonErr: s.reasonErr, onReason: v => this.setState({ reason: v, reasonErr: '' }),
      blockOpen: dt === 'block', blockItems, stop: e => e.stopPropagation()
    };
  }
}
