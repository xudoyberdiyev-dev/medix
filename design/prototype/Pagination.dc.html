<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:8px 16px;font-family:Inter,system-ui,sans-serif;font-size:13px;color:#5B6B6A;font-variant-numeric:tabular-nums">
  <span>{{ range }}</span>
  <div style="display:flex;align-items:center;gap:16px">
    <div style="position:relative">
      <button onClick="{{ togglePer }}" style="display:flex;align-items:center;gap:4px;height:30px;padding:0 8px;border:1px solid #E2E8F0;border-radius:8px;background:#FFFFFF;font-size:13px;color:#5B6B6A;cursor:pointer" style-hover="background:#F8FAFA">{{ perLabel }}: <span style="color:#172B2A;font-weight:500">{{ per }}</span><lucide-i name="chevron-down" size="14"></lucide-i></button>
      <sc-if value="{{ open }}">
        <div onClick="{{ togglePer }}" style="position:fixed;inset:0;z-index:40"></div>
        <div style="position:absolute;bottom:36px;left:0;width:100px;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 8px 24px rgba(18,60,58,0.12);padding:4px;z-index:41">
          <sc-for list="{{ perOpts }}" as="o"><button onClick="{{ o.pick }}" style="display:flex;align-items:center;justify-content:space-between;width:100%;height:30px;padding:0 8px;border:0;border-radius:6px;background:{{ o.bg }};font-size:13px;color:#172B2A;cursor:pointer" style-hover="background:#F8FAFA">{{ o.n }}<sc-if value="{{ o.selected }}"><lucide-i name="check" size="14" style="color:#0F766E"></lucide-i></sc-if></button></sc-for>
        </div>
      </sc-if>
    </div>
    <div style="display:flex;align-items:center;gap:4px">
      <button onClick="{{ prev }}" aria-label="{{ prevLabel }}" style="width:30px;height:30px;border:1px solid #E2E8F0;border-radius:8px;background:#FFFFFF;color:{{ prevColor }};display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:#F8FAFA"><lucide-i name="chevron-left" size="16"></lucide-i></button>
      <sc-for list="{{ pages }}" as="g"><button onClick="{{ g.go }}" style="min-width:30px;height:30px;padding:0 6px;border:0;border-radius:8px;background:{{ g.bg }};color:{{ g.color }};font-size:13px;font-weight:{{ g.weight }};cursor:pointer;transition:background 120ms ease-out" style-hover="background:#EEF2F4">{{ g.label }}</button></sc-for>
      <button onClick="{{ next }}" aria-label="{{ nextLabel }}" style="width:30px;height:30px;border:1px solid #E2E8F0;border-radius:8px;background:#FFFFFF;color:{{ nextColor }};display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:#F8FAFA"><lucide-i name="chevron-right" size="16"></lucide-i></button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:80},&quot;total&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:40,&quot;tsType&quot;:&quot;number&quot;},&quot;page&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;perPage&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:25,&quot;tsType&quot;:&quot;number&quot;},&quot;perLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Qatorlar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;prevLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Oldingi sahifa&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;nextLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Keyingi sahifa&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onPage&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(n)=&gt;void&quot;},&quot;onPer&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(n)=&gt;void&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const p = this.props, total = p.total || 0, per = p.perPage || 25, page = p.page || 1, pagesN = Math.max(1, Math.ceil(total / per));
    const from = total ? (page - 1) * per + 1 : 0, to = Math.min(total, page * per);
    const f = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const list = pagesN <= 7 ? Array.from({ length: pagesN }, (_, i) => i + 1) : [1, 2, 3, '…', pagesN];
    return {
      range: `${f(from)}–${f(to)} / ${f(total)}`, per, open: this.state.open, togglePer: () => this.setState(s => ({ open: !s.open })),
      perOpts: (p.perOptions || [25, 50, 100]).map(n => ({ n, selected: n === per, bg: n === per ? '#DDF5EE' : 'transparent', pick: () => { this.setState({ open: false }); p.onPer && p.onPer(n); } })),
      pages: list.map(n => ({ label: String(n), bg: n === page ? '#DDF5EE' : 'transparent', color: n === page ? '#0F766E' : '#5B6B6A', weight: n === page ? 500 : 400, go: () => typeof n === 'number' && p.onPage && p.onPage(n) })),
      prev: () => page > 1 && p.onPage && p.onPage(page - 1), next: () => page < pagesN && p.onPage && p.onPage(page + 1),
      prevColor: page > 1 ? '#5B6B6A' : '#647574', nextColor: page < pagesN ? '#5B6B6A' : '#647574'
    };
  }
}
</script>
</body>
</html>
