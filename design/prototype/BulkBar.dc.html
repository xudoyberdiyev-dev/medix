<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:fixed;left:50%;bottom:24px;transform:translateX(-50%);height:44px;max-width:calc(100vw - 120px);display:flex;align-items:center;gap:4px;padding:0 6px 0 14px;background:#123C3A;border-radius:10px;box-shadow:0 8px 24px rgba(18,60,58,0.12);color:#FFFFFF;font-family:Inter,system-ui,sans-serif;font-size:13px;white-space:nowrap;z-index:30">
  <span style="font-weight:500;padding-right:8px">{{ countLabel }}</span>
  <sc-if value="{{ hasSelectAll }}"><button onClick="{{ selectAll.pick }}" style="height:32px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:#2DD4BF;font-size:13px;font-weight:500;cursor:pointer;text-decoration:underline;text-underline-offset:2px" style-hover="background:rgba(255,255,255,0.08)">{{ selectAll.label }}</button></sc-if>
  <span style="width:1px;height:20px;background:rgba(255,255,255,0.14)"></span>
  <sc-for list="{{ items }}" as="a">
    <button onClick="{{ a.pick }}" style="display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:#FFFFFF;font-size:13px;cursor:pointer;transition:background 120ms ease-out" style-hover="background:rgba(255,255,255,0.08)"><lucide-i name="{{ a.icon }}" size="16" style="color:{{ a.iconColor }}"></lucide-i>{{ a.label }}</button>
  </sc-for>
  <span style="width:1px;height:20px;background:rgba(255,255,255,0.14)"></span>
  <button onClick="{{ onClear }}" aria-label="{{ clearLabel }}" title="{{ clearLabel }}" style="width:32px;height:32px;border:0;border-radius:7px;background:transparent;color:#A9C7C3;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:rgba(255,255,255,0.08);color:#FFFFFF"><lucide-i name="x" size="16"></lucide-i></button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:120},&quot;countLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;3 ta tanlandi&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;actions&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label,icon,pick,danger?}[]&quot;},&quot;selectAll&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label,pick}&quot;},&quot;onClear&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;clearLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tanlovni bekor qilish&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    return { hasSelectAll: !!p.selectAll, selectAll: p.selectAll || {}, items: (p.actions || []).map(a => ({ ...a, iconColor: a.danger ? '#FECACA' : '#2DD4BF' })) };
  }
}
</script>
</body>
</html>
