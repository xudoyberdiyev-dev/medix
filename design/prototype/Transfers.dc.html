<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="medix-data.js"></script></helmet>
<div style="display:flex;flex-direction:column;min-width:0;font-family:Inter,system-ui,sans-serif;color:#172B2A;font-size:14px;line-height:20px;font-variant-numeric:tabular-nums">
<sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">

      </div>

    <sc-if value="{{ noRes }}"><dc-import name="EmptyState" icon="search-x" tone="neutral" title="{{ L.qz_noResT }}" text="{{ L.qz_noResD }}" primary="{{ clearAction }}" min-height="280" hint-size="100%,280px"></dc-import></sc-if>
  </div>
  <div style="height:48px"></div>
</div>
</sc-if>
<sc-if value="{{ isDoc }}" hint-placeholder-val="{{ false }}">
  <dc-import name="TransferDoc" kind="{{ doc.kind }}" no="{{ doc.no }}" req="{{ doc.req }}" act="{{ doc.act }}" doc-key="{{ doc.key }}" dict="{{ L }}" role="{{ role }}" branch="{{ branch }}" user-name="{{ userName }}" narrow="{{ narrow }}" on-back="{{ backToList }}" on-toast="{{ toastFn }}" on-navigate="{{ navFn }}" on-receive="{{ openRecv }}" on-open="{{ openNo }}" hint-size="100%,700px"></dc-import>
</sc-if>
<sc-if value="{{ isRecv }}" hint-placeholder-val="{{ false }}">
  <dc-import name="TransferReceive" no="{{ recv.no }}" preset="{{ recv.preset }}" doc-key="{{ recv.key }}" dict="{{ L }}" role="{{ role }}" branch="{{ branch }}" user-name="{{ userName }}" narrow="{{ narrow }}" on-back="{{ recvBack }}" on-toast="{{ toastFn }}" on-done="{{ recvDone }}" hint-size="100%,700px"></dc-import>
</sc-if>
</div>
</x-dc>
