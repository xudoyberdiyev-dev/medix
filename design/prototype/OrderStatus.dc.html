<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="medix-data.js"></script></helmet>
<span style="display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px 0 6px;border-radius:6px;background:{{ bg }};color:{{ fg }};font-family:Inter,system-ui,sans-serif;font-size:12px;line-height:22px;font-weight:500;white-space:nowrap"><lucide-i name="{{ icon }}" size="12"></lucide-i>{{ label }}</span>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:40},&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;draft&quot;,&quot;pending&quot;,&quot;queued&quot;,&quot;picking&quot;,&quot;marking&quot;,&quot;ready&quot;,&quot;shipped&quot;,&quot;delivered&quot;,&quot;rejected&quot;,&quot;cancelled&quot;],&quot;default&quot;:&quot;ready&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dict&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}">
// Buyurtma holatlari xaritasi: MedixData.ORDER_STATUS (ikonka, rang) + I18N b_st_* (matn)
class Component extends DCLogic {
  componentDidMount() { if (!window.MedixData) this._p = setInterval(() => { if (window.MedixData) { clearInterval(this._p); this.forceUpdate(); } }, 60); }
  componentWillUnmount() { clearInterval(this._p); }
  renderVals() {
    const p = this.props, M = (window.MedixData && window.MedixData.ORDER_STATUS) || {}, st = M[p.status] || { icon: 'circle', fg: '#5B6B6A', bg: '#EEF2F4' };
    const L = p.dict || {};
    return { icon: st.icon, fg: st.fg, bg: st.bg, label: p.label || L['b_st_' + p.status] || p.status || '' };
  }
}
</script>
</body>
</html>
