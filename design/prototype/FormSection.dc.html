<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 1px 2px rgba(18,60,58,0.04);padding:20px 24px;display:flex;flex-wrap:wrap;gap:16px 24px;font-family:Inter,system-ui,sans-serif;color:#172B2A">
  <div style="flex:{{ headFlex }};min-width:180px"><div style="font-size:14px;line-height:20px;font-weight:600">{{ title }}</div><sc-if value="{{ hasDesc }}"><div style="font-size:12px;line-height:16px;color:#647574">{{ description }}</div></sc-if></div>
  <div style="flex:1 1 440px;min-width:0">{{ children }}</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:880,&quot;height&quot;:200},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Asosiy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;description&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nom, ishlab chiqaruvchi va dori shakli&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;stacked&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;rt&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;ReactNode&quot;}}">
class Component extends DCLogic {
  renderVals() { return { hasDesc: !!this.props.description, headFlex: this.props.stacked ? '1 1 100%' : '0 1 240px' }; }
}
</script>
</body>
</html>
