<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="status" style="display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-radius:10px;background:{{ bg }};border:1px solid {{ border }};font-family:Inter,system-ui,sans-serif">
  <lucide-i name="{{ iconName }}" size="16" style="color:{{ fg }};margin-top:2px;flex:none"></lucide-i>
  <div style="display:flex;flex-direction:column;gap:2px;min-width:0;font-size:13px;line-height:20px;color:{{ fg }}">
    <sc-if value="{{ hasTitle }}"><span style="font-weight:600">{{ title }}</span></sc-if>
    <span style="text-wrap:pretty">{{ text }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:80},&quot;tone&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;info&quot;,&quot;danger&quot;,&quot;warning&quot;,&quot;success&quot;],&quot;default&quot;:&quot;info&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Hujjat tasdiqlangan: 04.10.2026, 15:10 · Sardor Aliyev. O'zgartirib bo'lmaydi, faqat bekor qilish mumkin.&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
const TONES = { info: ['#1D4ED8', '#EFF6FF', '#BFDBFE', 'info'], danger: ['#B91C1C', '#FEF2F2', '#FECACA', 'circle-x'], warning: ['#B45309', '#FFFBEB', '#FDE68A', 'triangle-alert'], success: ['#15803D', '#F0FDF4', '#BBF7D0', 'circle-check'], neutral: ['#5B6B6A', '#F8FAFA', '#E2E8F0', 'info'] };
class Component extends DCLogic {
  renderVals() { const p = this.props, t = TONES[p.tone] || TONES.info; return { fg: t[0], bg: t[1], border: t[2], iconName: p.icon || t[3], hasTitle: !!p.title }; }
}
</script>
</body>
</html>
