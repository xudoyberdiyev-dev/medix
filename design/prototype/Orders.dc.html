          { type: 'name', text: o.delivery === 'pickup' ? L.b_delPickup : L.b_delDeliver, sub: o.delivDate, weight: 400, color: col },
          ...(mid ? [{ type: 'text', text: L['oe_pay_' + D.payTypeOf(o)] || D.payTypeName(D.payTypeOf(o)), color: col || '#5B6B6A' }] : []),
          ...(wide ? [{ type: 'text', text: String(o.lines.length), color: col }] : []), { type: 'text', text: fM(t.total), color: col },
          { type: 'status', text: L['b_st_' + o.status], icon: st.icon, fg: st.fg, bg: st.bg, ...this.stSub(o) }, (() => { const h = D.holderOf ? D.holderOf(o) : null; return { type: 'text', text: !h ? '—' : h.who ? shortName(h.who) : (L['r_' + h.role] || h.role), color: !h ? '#647574' : h.who ? '#172B2A' : '#647574' }; })()].concat(wide ? [{ type: 'text', text: shortName(o.op), color: col || '#5B6B6A' }] : []),
        actions: [{ label: L.p_aOpen, icon: 'arrow-up-right', pick: () => this.openOrder(o) }] };
    });
    const selPage = pageRows.filter(o => s.sel[o.id]).length, selCount = Object.keys(s.sel).length;
    const allState = !pageRows.length || !selPage ? 'none' : selPage === pageRows.length ? 'all' : 'some';
    const uniq = f => [...new Set(base.map(f))].filter(Boolean).sort((a, b) => String(a).localeCompare(String(b)));
    const opt = (vals, f, lab) => vals.map(v => ({ value: v, label: lab ? lab(v) : v, count: base.filter(o => f(o) === v).length }));
    const set = k => v => this.setState({ [k]: v, page: 1 });
    const clear = { fCust: [], fStatus: [], fDel: [], fRegion: [], fOp: [], fPay: [], late: false, date: { from: null, to: null }, page: 1 };
    const hasFilters = !!(s.fCust.length || s.fStatus.length || s.fDel.length || s.fRegion.length || s.fOp.length || s.fPay.length || s.late || from);
    const activeF = [s.q.trim() && `${L.p_searchWord} «${s.q.trim()}»`, s.fCust.length && L.b_fCust, s.fStatus.length && L.b_fStatus, from && L.b_fDate, s.fDel.length && L.b_fDel, s.fRegion.length && L.b_fRegion, s.fOp.length && L.b_fOp].filter(Boolean);
    const hdrPrimary = this.canCreate() ? { label: L.b_new, icon: 'plus', kbd: 'N', pick: () => this.newOrder() } : null;
    return {
      ...common, countLabel: fN(base.length), hdrPrimary,
      hdrMore: [{ label: L.p_export, icon: 'download', pick: () => this.toast(L.p_exportToast) }],
      views, q: s.q, setQ: v => this.setState({ q: v, page: 1 }), fbLabels: { search: L.p_fSearch, reset: L.p_fReset, apply: L.p_fApply, remove: L.p_fRemove, none: L.p_fNone },
      fbFilters: [
        { label: L.b_fCust, options: opt(uniq(o => cust(o).name), o => cust(o).name), selected: s.fCust, onChange: set('fCust') },
        { label: L.b_fStatus, options: opt(Object.keys(ST).filter(k => base.some(o => o.status === k)), o => o.status, k => L['b_st_' + k]), selected: s.fStatus, onChange: set('fStatus') },
        { label: L.b_fDel, options: opt(['deliver', 'pickup'], o => o.delivery, k => k === 'pickup' ? L.b_delPickup : L.b_delDeliver), selected: s.fDel, onChange: set('fDel') },
        { label: L.b_fRegion, options: opt(uniq(o => cust(o).region), o => cust(o).region), selected: s.fRegion, onChange: set('fRegion') },
        { label: L.b_fOp, options: opt(uniq(o => o.op), o => o.op), selected: s.fOp, onChange: set('fOp') },
        { label: L.oe_hPayType, options: opt(D.PT3, o => D.payTypeOf(o), k => L['oe_pay_' + k]), selected: s.fPay, onChange: set('fPay') }],
      stTabs, lateOn: !!s.late, lateLabel: (L.bh_stLate || '') + ' · ' + (D.CONFIG ? D.CONFIG.orderLateDays : 2) + '+ kun', lateOff: () => this.setState({ late: false, page: 1 }),
      dateFilter: { label: L.b_fDate, from: s.date.from, to: s.date.to, onChange: v => this.setState({ date: v, page: 1 }), labels: { today: L.k_drToday, yesterday: L.k_drYesterday, week: L.k_drWeek, month: L.k_drMonth, lastMonth: L.k_drLastMonth, reset: L.p_fReset, apply: L.p_fApply, pick: L.k_drPick, remove: L.p_fRemove, prev: L.k_drPrev, next: L.k_drNext } },
      hasFilters, clearFilters: () => this.setState(clear),
      showTable: total > 0, tColumns, tRows, allState, tMinWidth: narrow ? 1310 : 0,
      toggleAll: () => this.setState(x => { const n = { ...x.sel }; if (allState === 'all') pageRows.forEach(o => delete n[o.id]); else pageRows.forEach(o => n[o.id] = true); return { sel: n }; }),
      onSort: k => this.setState(x => ({ sort: !x.sort || x.sort.key !== k ? { key: k, dir: 'asc' } : x.sort.dir === 'asc' ? { key: k, dir: 'desc' } : null })),
      total, page, per: s.per, setPage: n => this.setState({ page: n }), setPer: n => this.setState({ per: n, page: 1 }),
      listEmpty: base.length === 0, listNoRes: base.length > 0 && total === 0,
      noResText: L.p_noResD ? L.p_noResD(activeF.join(', ') || '—') : '', noResAction: { label: L.p_fClear, icon: 'filter-x', pick: () => this.setState({ ...clear, q: '', tab: 'all' }) },
      hasSel: selCount > 0, selLabel: L.p_selected ? L.p_selected(selCount) : '', clearSel: () => this.setState({ sel: {} }),
      bulkActions: [{ label: L.q9_printSheets, icon: 'printer', pick: () => this.printSel() }, { label: 'Excel', icon: 'download', pick: () => this.toast(L.p_exportToast) }]
    };
  }
