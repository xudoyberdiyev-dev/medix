<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:sticky;bottom:-24px;margin:0 -24px -24px;height:64px;display:flex;align-items:center;justify-content:center;background:#FFFFFF;border-top:1px solid #E2E8F0;z-index:5;font-family:Inter,system-ui,sans-serif">
  <div style="width:100%;max-width:{{ maxW }}px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:12px">
    <span style="display:flex;align-items:center;gap:8px;font-size:13px;color:#5B6B6A;min-width:0">
      <sc-if value="{{ dirty }}"><span style="width:8px;height:8px;flex:none;border-radius:50%;background:#B45309"></span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ dirtyLabel }}</span></sc-if>
    </span>
    <div style="display:flex;gap:8px;flex:none">
      <button onClick="{{ onCancel }}" style="height:34px;padding:0 14px;border:1px solid #E2E8F0;border-radius:8px;background:#FFFFFF;font-size:13px;font-weight:500;color:#172B2A;cursor:pointer;transition:background 120ms ease-out" style-hover="background:#F8FAFA">{{ cancelLabel }}</button>
      <button onClick="{{ onSave }}" style="display:flex;align-items:center;gap:6px;height:34px;padding:0 16px;border:0;border-radius:8px;background:#0F766E;color:#FFFFFF;font-size:13px;font-weight:500;cursor:pointer;transition:background 120ms ease-out" style-hover="background:#115E59" style-active="background:#134E4A"><lucide-i name="check" size="16"></lucide-i>{{ saveLabel }}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:900,&quot;height&quot;:100},&quot;dirty&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dirtyLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Saqlanmagan o'zgarishlar bor&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cancelLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bekor qilish&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;saveLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Saqlash&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;maxWidth&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:880,&quot;tsType&quot;:&quot;number&quot;},&quot;onCancel&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onSave&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() { const p = this.props; return { maxW: p.maxWidth || 880, dirty: !!p.dirty, saveLabel: p.saveLabel || '', cancelLabel: p.cancelLabel || '', dirtyLabel: p.dirtyLabel || '' }; }
}
</script>
</body>
</html>
