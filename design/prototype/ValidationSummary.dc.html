<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ close }}" style="position:fixed;inset:0;z-index:180;background:rgba(18,43,42,0.30);display:flex;align-items:center;justify-content:center;padding:24px;font-family:Inter,system-ui,sans-serif;color:#172B2A">
  <div role="alertdialog" aria-modal="true" onClick="{{ stop }}" style="width:520px;max-width:100%;max-height:calc(100vh - 48px);display:flex;flex-direction:column;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;box-shadow:0 8px 24px rgba(18,60,58,0.12)">
    <div style="display:flex;align-items:flex-start;gap:12px;padding:20px 24px 12px">
      <span style="width:32px;height:32px;flex:none;border-radius:50%;background:#FEF2F2;color:#B91C1C;display:flex;align-items:center;justify-content:center"><lucide-i name="circle-alert" size="18"></lucide-i></span>
      <div style="flex:1;min-width:0"><h2 style="margin:0;font-size:17px;line-height:24px;font-weight:600">{{ title }}</h2><p style="margin:2px 0 0;font-size:13px;line-height:18px;color:#5B6B6A">{{ subtitle }}</p></div>
      <button onClick="{{ close }}" aria-label="{{ closeLabel }}" style="width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#5B6B6A;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:#F5F7F8"><lucide-i name="x" size="16"></lucide-i></button>
    </div>
    <div style="overflow-y:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;flex-direction:column">
        <sc-for list="{{ errs }}" as="e">
          <button onClick="{{ e.go }}" style="display:flex;align-items:center;gap:10px;min-height:40px;padding:8px;border:0;border-radius:8px;background:transparent;text-align:left;font-size:13px;line-height:18px;color:#172B2A;cursor:pointer" style-hover="background:#FEF2F2">
            <lucide-i name="circle-x" size="16" style="color:#B91C1C;flex:none"></lucide-i><span style="flex:1;min-width:0;text-wrap:pretty">{{ e.text }}</span><lucide-i name="chevron-right" size="16" style="color:#647574;flex:none"></lucide-i>
          </button>
        </sc-for>
      </div>
      <sc-if value="{{ hasWarn }}">
        <div style="display:flex;flex-direction:column;border-top:1px solid #EEF2F4;padding-top:12px">
          <span style="padding:0 8px 6px;font-size:12px;line-height:16px;font-weight:500;color:#B45309">{{ warnTitle }}</span>
          <sc-for list="{{ warns }}" as="w">
            <button onClick="{{ w.go }}" style="display:flex;align-items:center;gap:10px;min-height:40px;padding:8px;border:0;border-radius:8px;background:transparent;text-align:left;font-size:13px;line-height:18px;color:#172B2A;cursor:pointer" style-hover="background:#FFFBEB">
              <lucide-i name="triangle-alert" size="16" style="color:#B45309;flex:none"></lucide-i><span style="flex:1;min-width:0;text-wrap:pretty">{{ w.text }}</span><lucide-i name="chevron-right" size="16" style="color:#647574;flex:none"></lucide-i>
            </button>
          </sc-for>
        </div>
      </sc-if>
    </div>
    <div style="display:flex;justify-content:flex-end;padding:12px 24px 20px;border-top:1px solid #EEF2F4">
      <button onClick="{{ close }}" style="height:34px;padding:0 14px;border:1px solid #E2E8F0;border-radius:8px;background:#FFFFFF;font-size:14px;font-weight:500;color:#172B2A;cursor:pointer" style-hover="background:#F8FAFA">{{ closeLabel }}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:600,&quot;height&quot;:480},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tasdiqlab bo'lmaydi: 3 ta muammo&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Muammoni bosing — o'sha katakka o'tasiz.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;errors&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{text,go}[]&quot;},&quot;warnings&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{text,go}[]&quot;},&quot;warnTitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;E'tibor bering (tasdiqlashga to'sqinlik qilmaydi)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;closeLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Yopish&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onClose&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;}}">
class Component extends DCLogic {
  componentDidMount() { this.onKey = e => { if (e.key === 'Escape') this.props.onClose && this.props.onClose(); }; window.addEventListener('keydown', this.onKey); }
  componentWillUnmount() { window.removeEventListener('keydown', this.onKey); }
  renderVals() {
    const p = this.props, wrap = x => ({ text: x.text, go: () => { p.onClose && p.onClose(); x.go && setTimeout(x.go, 0); } });
    return { errs: (p.errors || []).map(wrap), warns: (p.warnings || []).map(wrap), hasWarn: !!(p.warnings && p.warnings.length),
      close: () => p.onClose && p.onClose(), stop: e => e.stopPropagation() };
  }
}
</script>
</body>
</html>
