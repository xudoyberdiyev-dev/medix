<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mt&quot;,&quot;yt&quot;],&quot;default&quot;:&quot;mt&quot;,&quot;tsType&quot;:&quot;'mt'|'yt'&quot;},&quot;party&quot;:{&quot;editor&quot;:null,&quot;default&quot;:13,&quot;tsType&quot;:&quot;number|string&quot;},&quot;branch&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;TSH&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;no&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;act&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;docKey&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;parentLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Farm Lux&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dict&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;accountant&quot;,&quot;branch&quot;,&quot;director&quot;,&quot;admin&quot;],&quot;default&quot;:&quot;accountant&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Jasur Ergashev&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;narrow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onBack&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onToast&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(t)=&gt;void&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(k,arg)=&gt;void&quot;}}">

  }

    const save = () => { if (!D.canR(p.role, 'ADV_ROLES', 'create')) return this.toast(this.who(D.ADV_ROLES.create)); const n = D.saveAdv(d); this.setState({ d: n }); this.toast(fill(L.qz_tSaved, { n: n.no })); };

    const steps = st === 'cancelled' ? [{ label: L.tl_st_draft, state: 'done' }, { label: L.tl_st_posted, state: 'done' }, { label: L.tl_st_cancelled, state: 'fail' }] : [{ label: L.tl_st_draft, state: ed ? 'cur' : 'done' }, { label: L.tl_st_posted, state: st === 'posted' ? 'cur' : 'next' }];
    const at = x => String(x || '').replace(' ', ', '), banners = [];
    if (d.auto) banners.push({ tone: 'info', icon: 'wallet', title: fill(L.qz_bAutoT, { s: fM(D.advSum(d)), n: d.no }), text: fill(L.qz_bAutoD, { d: d.src }) });
    if (st === 'posted' && !d.auto) banners.push({ tone: 'success', icon: 'circle-check', title: '', text: fill(L.tl_bPosted, { at: at(d.postedAt), who: d.postedBy }) });
    if (st === 'cancelled') banners.push({ tone: 'neutral', icon: 'circle-x', title: fill(L.tl_bCancelled, { at: at(d.cancelledAt), who: d.cancelledBy }), text: d.cancelReason || '' });
    const inv = Lg.invoices, visible = ed ? inv.filter(x => x.left > 0 || c.am[x.no] > 0) : inv.filter(x => c.am[x.no] > 0);
    const gRows = visible.map(x => ({ no: x.no, arch: !!x.open, tip: x.open ? L.kb_archTip : '', date: x.date, ext: x.extNo, due: x.due, sum: x.sum, ret: x.ret, prior: x.paid, left: x.left, late: x.late, value: c.am[x.no] || null, err: c.rowErr[x.no] ? L.qz_eRowShort : '',
      onOpen: x.oid != null ? () => { D.store.openReq = x.oid; p.onNavigate && p.onNavigate('orders'); } : x.rc ? () => p.onNavigate && p.onNavigate('receipt', 'open:' + x.no) : null,
      onValue: n => { this.setState({ manual: true }); upd(z => { z.alloc = (z.alloc || []).filter(a => a.no !== x.no); if (n > 0) z.alloc.push({ no: x.no, sum: r2(n) }); }); } }));
    const gLabels = { arch: L.kb_arch, title: K === 'mt' ? L.qz_gTitle : L.qz_gTitleYt, auto: L.tl_auto, manual: L.tl_manual, manualTip: L.tl_manualTip, paid: L.tl_paid, after: L.tl_after, days: L.tl_days,
      c_no: K === 'mt' ? L.tl_c_no : L.tl_c_noYt, c_date: L.tl_c_date, c_ext: L.tl_c_ext, c_due: L.tl_c_due, c_sum: K === 'mt' ? L.tl_c_sum : L.tl_c_sumYt, c_ret: K === 'mt' ? L.tl_c_ret : L.tl_c_retYt, c_prior: L.tl_c_prior, c_left: L.tl_c_left, c_late: L.tl_c_late, c_val: L.qz_c_val };
    const advLeft = r2(Lg.advance - c.tot), debtAfter = st === 'posted' ? D.ledger(K, d.party, d.branch).debt : r2(Lg.debt - (ed ? c.tot : 0));
    const kpis = [{ label: L.qz_kAvail, value: fM(Lg.advance), color: '#1D4ED8', size: '20px' }, { label: L.qz_kAlloc, value: fM(c.tot), size: '20px', color: c.tot > Lg.advance + 0.005 ? '#B91C1C' : '#172B2A' },
      { label: L.qz_kAdvLeft, value: fM(st === 'cancelled' ? Lg.advance : advLeft), size: '20px', color: advLeft < 0 ? '#B91C1C' : '#172B2A' }, { label: st === 'draft' ? L.qz_kDebtAfter : L.qz_c_debt, value: fM(debtAfter), size: '20px', pickTip: L.qz_openCard, pick: () => p.onBack && p.onBack() }];
    const infoRows = [{ label: K === 'mt' ? L.qz_c_cust : L.qz_c_sup, value: name }, { label: L.stir || 'STIR', value: D.partyStir(K, d.party), mono: true }, { label: L.qz_c_br, value: brName }, { label: L.qz_c_date, value: d.date }, { label: L.qz_ahType, value: d.auto ? L.qz_ahAutoT : L.qz_ahManualT }, ...(d.src ? [{ label: L.qz_ahSrc, value: d.src, mono: true }] : [])];

      ...base, number: d.no || L.qz_new, badge: { label: L['tl_st_' + st], icon: S[0], fg: S[1], bg: S[2] }, steps, banners,
