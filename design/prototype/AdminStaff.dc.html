<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:20px;font-family:Inter,system-ui,sans-serif;color:#172B2A;font-size:14px;line-height:20px;font-variant-numeric:tabular-nums">

  <sc-if value="{{ isRoles }}" hint-placeholder-val="{{ false }}">
    <div ref="{{ rolesRef }}" style="height:{{ rolesH }}px;margin:-32px -24px -24px;display:flex;flex-direction:column;min-height:420px">
      <dc-import name="WizRoles" mode="page" dict="{{ L }}" demo="{{ demo }}" user-name="{{ userName }}" narrow="{{ narrow }}" hint-size="100%,100%" style="flex:1;min-height:0"></dc-import>
    </div>
  </sc-if>

  <sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
    <div style="margin:-32px -24px -24px">
      <dc-import name="WizStaff" mode="page" dict="{{ L }}" demo="{{ demo }}" narrow="{{ narrow }}" read-only="{{ readOnly }}" scope-branch="{{ scopeBranch }}" on-open-emp="{{ openEmp }}" hint-size="100%,600px"></dc-import>
    </div>
  </sc-if>

  <sc-if value="{{ isCard }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex;align-items:flex-start;gap:14px">
      <span style="width:40px;height:40px;flex:none;margin-top:22px;border-radius:50%;background:#DDF5EE;color:#0F766E;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center">{{ c.av }}</span>
      <div style="flex:1;min-width:0">
        <dc-import name="RecordHeader" parent-label="{{ L.n_staff }}" on-parent="{{ back }}" title="{{ c.name }}" badges="{{ c.badges }}" meta="{{ c.meta }}" mono="{{ c.login }}" primary="{{ c.primary }}" more="{{ c.more }}" read-only="{{ readOnly }}" read-only-label="{{ L.bs_readOnly }}" more-label="{{ L.bs_more }}" hint-size="100%,76px"></dc-import>
      </div>
    </div>
    <div style="display:flex;gap:4px;border-bottom:1px solid #E2E8F0;overflow-x:auto">
      <sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="4"><button onClick="{{ tb.pick }}" style="flex:none;height:40px;padding:0 12px;border:0;border-bottom:2px solid {{ tb.line }};margin-bottom:-1px;background:transparent;font:inherit;font-size:13px;font-weight:{{ tb.w }};color:{{ tb.fg }};cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px" style-hover="color:#172B2A">{{ tb.label }}<sc-if value="{{ tb.hasN }}"><span style="height:18px;padding:0 6px;border-radius:6px;background:#EEF2F4;color:#5B6B6A;font-size:11.5px;line-height:18px;font-weight:500">{{ tb.n }}</span></sc-if></button></sc-for>
    </div>

    <sc-if value="{{ tInfo }}">
      <div style="max-width:820px"><dc-import name="InfoGrid" title="{{ L.bs_igPersonal }}" rows="{{ c.info }}" hint-size="100%,380px"></dc-import></div>
    </sc-if>

    <sc-if value="{{ tPerm }}">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
        <span style="font-size:13px;color:#5B6B6A">{{ permHead }}</span>
        <sc-if value="{{ canRoles }}"><button onClick="{{ goRoles }}" style="padding:0;border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:#0F766E;cursor:pointer;display:flex;align-items:center;gap:4px" style-hover="color:#0F766E;text-decoration:underline">{{ L.bs_changeRoleLink }}<lucide-i name="arrow-up-right" size="14"></lucide-i></button></sc-if>
      </div>
      <div style="display:grid;grid-template-columns:{{ permCols }};gap:12px;align-items:start">
        <sc-for list="{{ permGroups }}" as="g" hint-placeholder-count="4">
          <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;justify-content:space-between;gap:8px"><span style="font-size:13px;line-height:18px;font-weight:600">{{ g.name }}</span><span style="font-size:12px;color:#647574">{{ g.n }}</span></div>
            <sc-for list="{{ g.items }}" as="x"><div style="display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:18px;color:#172B2A"><lucide-i name="check" size="14" style="color:#15803D;margin-top:2px"></lucide-i><span>{{ x }}</span></div></sc-for>
            <sc-if value="{{ g.none }}"><span style="font-size:13px;color:#647574">{{ L.bs_noPerms }}</span></sc-if>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ tList }}">
      <sc-if value="{{ lt.hasLink }}"><div style="display:flex;justify-content:flex-end"><button onClick="{{ lt.link }}" style="padding:0;border:0;background:transparent;font:inherit;font-size:13px;font-weight:500;color:#0F766E;cursor:pointer;display:flex;align-items:center;gap:4px" style-hover="color:#0F766E;text-decoration:underline">{{ L.bs_openInAudit }}<lucide-i name="arrow-up-right" size="14"></lucide-i></button></div></sc-if>
      <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;overflow:hidden">
        <div style="overflow-x:auto"><div style="min-width:620px">
          <div style="display:grid;grid-template-columns:{{ lt.grid }};gap:12px;padding:10px 16px;background:#F8FAFA;border-bottom:1px solid #E2E8F0;font-size:12px;line-height:16px;font-weight:500;color:#5B6B6A">
            <sc-for list="{{ lt.heads }}" as="h"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ h }}</span></sc-for>
          </div>
          <sc-for list="{{ lt.rows }}" as="r" hint-placeholder-count="5">
            <div style="display:grid;grid-template-columns:{{ lt.grid }};gap:12px;align-items:center;min-height:44px;padding:6px 16px;border-bottom:1px solid #EEF2F4">
              <span style="font-family:'JetBrains Mono',monospace;font-size:12.5px;white-space:nowrap">{{ r.at }}</span>
              <span style="display:flex;align-items:center;gap:6px;min-width:0"><sc-if value="{{ r.hasIcon }}"><lucide-i name="{{ r.icon }}" size="15" style="color:{{ r.ic }}"></lucide-i></sc-if><span style="font-size:13px;color:{{ r.fg }};font-weight:{{ r.fw }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.a }}</span></span>
              <span style="font-size:13px;color:#5B6B6A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.b }}</span>
            </div>
          </sc-for>
          <sc-if value="{{ lt.empty }}"><div style="padding:32px 16px;text-align:center;font-size:13px;color:#5B6B6A">{{ L.bs_noRows }}</div></sc-if>
        </div></div>
      </div>
    </sc-if>
  </sc-if>

  <sc-if value="{{ pickOpen }}">
    <div style="position:fixed;inset:0;z-index:190;display:flex;align-items:center;justify-content:center;padding:24px">
      <div onClick="{{ pickCancel }}" style="position:absolute;inset:0;background:rgba(18,43,42,0.30)"></div>
      <div role="dialog" aria-modal="true" style="position:relative;width:480px;max-width:100%;max-height:100%;overflow:auto;background:#FFFFFF;border-radius:12px;box-shadow:0 16px 40px rgba(18,60,58,0.18);padding:20px 24px;display:flex;flex-direction:column;gap:14px">
        <h2 style="margin:0;font-size:17px;line-height:24px;font-weight:600">{{ pk.title }}</h2>
        <div style="display:flex;flex-direction:column;gap:6px">
          <sc-for list="{{ pk.opts }}" as="o"><button onClick="{{ o.pick }}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;padding:6px 12px;border:1px solid {{ o.bd }};border-radius:8px;background:{{ o.bg }};font:inherit;font-size:14px;text-align:left;cursor:pointer"><span>{{ o.label }}</span><span style="font-size:12px;color:#647574">{{ o.sub }}</span></button></sc-for>
        </div>
        <sc-if value="{{ pk.hasBr }}">
          <div style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:13px;font-weight:500">{{ L.rl_cBranch }}</span>
            <div style="display:flex;gap:6px;flex-wrap:wrap"><sc-for list="{{ pk.brs }}" as="b"><button onClick="{{ b.pick }}" style="height:34px;padding:0 12px;border:1px solid {{ b.bd }};border-radius:8px;background:{{ b.bg }};font:inherit;font-size:13px;cursor:pointer">{{ b.label }}</button></sc-for></div>
          </div>
        </sc-if>
        <sc-if value="{{ pk.hasWarn }}"><div style="padding:10px 12px;border:1px solid #FDE68A;border-radius:8px;background:#FFFBEB;color:#B45309;font-size:13px;line-height:18px;display:flex;gap:8px"><lucide-i name="triangle-alert" size="16" style="margin-top:1px"></lucide-i><span>{{ pk.warn }}</span></div></sc-if>
        <div style="display:flex;justify-content:flex-end;gap:8px">
          <button onClick="{{ pickCancel }}" style="height:34px;padding:0 14px;border:1px solid #E2E8F0;border-radius:8px;background:#FFFFFF;font:inherit;font-size:13px;font-weight:500;cursor:pointer" style-hover="border-color:#647574">{{ L.bs_cancel }}</button>
          <button onClick="{{ pickOk }}" style="height:34px;padding:0 14px;border:0;border-radius:8px;background:{{ pk.okBg }};color:#FFFFFF;font:inherit;font-size:13px;font-weight:500;cursor:pointer">{{ L.bs_next }}</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ credsOpen }}">
    <div style="position:fixed;inset:0;z-index:190;display:flex;align-items:center;justify-content:center;padding:24px">
      <div style="position:absolute;inset:0;background:rgba(18,43,42,0.30)"></div>
      <div role="dialog" aria-modal="true" style="position:relative;width:440px;max-width:100%;background:#FFFFFF;border-radius:12px;box-shadow:0 16px 40px rgba(18,60,58,0.18);padding:20px 24px;display:flex;flex-direction:column;gap:14px">
        <h2 style="margin:0;font-size:17px;line-height:24px;font-weight:600">{{ L.rl_crT }}</h2>
        <div style="border:1px solid #E2E8F0;border-radius:8px;padding:4px 14px;background:#F8FAFA">
          <sc-for list="{{ cr }}" as="l"><div style="display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #EEF2F4"><span style="font-size:13px;color:#5B6B6A">{{ l.k }}</span><span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500">{{ l.v }}</span></div></sc-for>
        </div>
        <p style="margin:0;font-size:13px;line-height:18px;color:#B45309">{{ L.bs_pwOnce }}</p>
        <div style="display:flex;justify-content:flex-end;gap:8px">
          <button onClick="{{ copyCreds }}" style="height:34px;padding:0 14px;border:1px solid #E2E8F0;border-radius:8px;background:#FFFFFF;font:inherit;font-size:13px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:6px" style-hover="border-color:#647574"><lucide-i name="copy" size="15"></lucide-i>{{ L.bs_copy }}</button>
          <button onClick="{{ closeCreds }}" style="height:34px;padding:0 14px;border:0;border-radius:8px;background:#0F766E;color:#FFFFFF;font:inherit;font-size:13px;font-weight:500;cursor:pointer" style-hover="background:#115E59">{{ L.bs_done }}</button>
        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ ruleOpen }}">
    <div style="position:fixed;inset:0;z-index:195;display:flex;align-items:center;justify-content:center;padding:24px">
      <div onClick="{{ ruleClose }}" style="position:absolute;inset:0;background:rgba(18,43,42,0.30)"></div>
      <div role="alertdialog" aria-modal="true" style="position:relative;width:440px;max-width:100%;background:#FFFFFF;border-radius:12px;box-shadow:0 16px 40px rgba(18,60,58,0.18);padding:20px 24px;display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:center;gap:10px"><span style="width:32px;height:32px;flex:none;border-radius:50%;background:#FFFBEB;color:#B45309;display:flex;align-items:center;justify-content:center"><lucide-i name="lock" size="16"></lucide-i></span><h2 style="margin:0;font-size:17px;line-height:24px;font-weight:600">{{ rule.title }}</h2></div>
        <p style="margin:0;font-size:14px;line-height:20px;text-wrap:pretty">{{ rule.text }}</p>
        <div style="display:flex;justify-content:flex-end"><button onClick="{{ ruleClose }}" style="height:34px;padding:0 14px;border:0;border-radius:8px;background:#0F766E;color:#FFFFFF;font:inherit;font-size:13px;font-weight:500;cursor:pointer" style-hover="background:#115E59">{{ L.bs_understood }}</button></div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ dlgOpen }}">
    <dc-import name="ConfirmDialog" title="{{ dlg.title }}" text="{{ dlg.text }}" items="{{ dlg.items }}" danger="{{ dlg.danger }}" with-reason="{{ dlg.withReason }}" reason-label="{{ L.bs_reasonReq }}" reason="{{ reason }}" on-reason="{{ onReason }}" reason-error="{{ reasonErr }}" confirm-label="{{ dlg.confirm }}" cancel-label="{{ L.bs_cancel }}" on-confirm="{{ dlg.run }}" on-cancel="{{ closeDlg }}" hint-size="0px,0px"></dc-import>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;page&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;staff&quot;,&quot;roles&quot;],&quot;default&quot;:&quot;staff&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;director&quot;,&quot;admin&quot;,&quot;branch&quot;],&quot;default&quot;:&quot;director&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;narrow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dict&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;demo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;branch&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;TSH&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Akmal Karimov&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onToast&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;function&quot;}}">
const fill = (t, o) => String(t || '').replace(/\{(\w+)\}/g, (_, k) => o[k] != null ? o[k] : '');
const ini = n => String(n || '').split(' ').map(x => x[0] || '').join('').slice(0, 2).toUpperCase();
const ACT = { create: ['file-plus', '#0F766E'], approve: ['circle-check', '#15803D'], cancel: ['circle-x', '#B91C1C'], change: ['pencil', '#5B6B6A'], login: ['log-in', '#0F766E'], loginFail: ['shield-x', '#B91C1C'], block: ['ban', '#B91C1C'], perm: ['shield-check', '#7C3AED'], setting: ['settings', '#B45309'] };
class Component extends DCLogic {
  state = { emp: null, tab: 'info', pick: null, dlg: null, reason: '', rTried: false, creds: null, rule: null, rh: 640, v: 0 };
  rolesRef = React.createRef();
  get D() { return window.MedixData; }
  get L() { return this.props.dict || {}; }
  componentDidMount() { const D = this.D; if (D && D.store.bsEmp) { this.setState({ emp: D.store.bsEmp, tab: 'info' }); D.store.bsEmp = null; } this.onResize = () => this.measure(); window.addEventListener('resize', this.onResize); setTimeout(() => this.measure(), 0); this.runDemo(); }
  componentWillUnmount() { window.removeEventListener('resize', this.onResize); }
  componentDidUpdate(pp) { const d = this.props.demo; if (d && (!pp.demo || pp.demo.n !== d.n)) this.runDemo(); if (pp.page !== this.props.page) { this.setState({ emp: null }); setTimeout(() => this.measure(), 0); } }
  // C5: pastki panel oynaning pastiga yopishadi — mavjud balandlik o'lchanadi
  measure() { const el = this.rolesRef.current; if (!el) return; const h = Math.max(420, Math.round(window.innerHeight - el.getBoundingClientRect().top)); if (Math.abs(h - this.state.rh) > 2) this.setState({ rh: h }); }
  runDemo() {
    const k = this.props.demo && this.props.demo.k, D = this.D; if (!k || !D) return;
    const byLogin = l => (D.store.emps || []).find(e => e.login === l);
    if (k === 'bsRoleChange') { const e = byLogin('m.yusupova'); this.setState({ emp: e.id, tab: 'perm', pick: null }, () => this.roleConfirm(e, 'keeper', e.branch)); } // demo
    if (k === 'bsSelfBlock') { const e = byLogin('a.karimov'); this.setState({ emp: e.id, tab: 'info' }, () => this.askBlock(e)); }
    if (k === 'bsLastDirector') { const e = byLogin('a.karimov'); this.setState({ emp: e.id, tab: 'info' }, () => this.askBlock(e)); }
  }
  bump() { this.setState(s => ({ v: s.v + 1 })); }
  toast(t) { this.props.onToast && this.props.onToast(t); }
  who() { return this.props.userName || this.D.DIRECTOR; }
  act(fn) { this.D.store.actor = this.who(); try { fn(); } finally { this.D.store.actor = null; } this.bump(); }
  roleName(id) { const r = this.D.rlRoles().find(x => x.id === id); return r ? (r.std ? this.L['r_' + r.id] : r.name) : '—'; }
  scope(id) { const r = this.D.rlRoles().find(x => x.id === id); return r ? r.scope : 'own'; }
  brName(c) { return c ? ((this.D.BRANCHES.find(b => b.code === c) || {}).name || c) : this.L.rl_scAll; }
  permSet(role) { const D = this.D; return role === 'director' ? D.rlDefault('director') : (D.permsOf(role) || {}); }
  pName(k) { return this.L['rl_p_' + k.replace('.', '_')] || k; }
  isSelf(e) { return this.D.empName(e) === this.who(); }
  rule(title, text) { this.setState({ rule: { title, text }, dlg: null, pick: null }); }
  openDocs(e) { const D = this.D, nm = D.empName(e), open = s => s === 'draft' || s === 'pending'; let n = 0; const f = L => (L || []).forEach(x => { if (open(x.status) && [x.op, x.who, x.author, x.by].includes(nm)) n++; }); f(D.store.orders); f(D.store.receipts); f(D.store.pays); f(D.store.mops); ['qm', 'hc', 'qy'].forEach(k => f((D.store.docs || {})[k])); return n; }
  // ---- C3 harakatlar ----
  askRole(e) { const L = this.L; if (this.isSelf(e)) return this.rule(L.bs_rSelfT, L.bs_rSelfRole); if (e.role === 'director' && this.lastDirector(e)) return this.rule(L.bs_rLastDirT, L.bs_rLastDirRole); this.setState({ pick: { kind: 'role', id: e.id, role: e.role, branch: e.branch } }); }
  askBranch(e) { const L = this.L; if (this.scope(e.role) === 'all') return this.rule(L.bs_ruleT, fill(L.bs_rAllBr, { r: this.roleName(e.role) })); this.setState({ pick: { kind: 'branch', id: e.id, branch: e.branch } }); }
  roleConfirm(e, role, branch) {
    const L = this.L, D = this.D, a = this.permSet(e.role), b = this.permSet(role), add = Object.keys(b).filter(k => b[k] && !a[k]), rem = Object.keys(a).filter(k => a[k] && !b[k]);
    const items = add.slice(0, 6).map(k => ({ text: '+ ' + this.pName(k), icon: 'plus', color: '#15803D' })).concat(add.length > 6 ? [{ text: fill(L.bs_andMore, { n: add.length - 6 }), icon: 'dot', color: '#15803D' }] : [])
      .concat(rem.slice(0, 6).map(k => ({ text: '− ' + this.pName(k), icon: 'minus', color: '#B91C1C' }))).concat(rem.length > 6 ? [{ text: fill(L.bs_andMore, { n: rem.length - 6 }), icon: 'dot', color: '#B91C1C' }] : []);
    this.setState({ pick: null, dlg: { title: fill(L.bs_roleT, { n: D.empName(e), a: this.roleName(e.role), b: this.roleName(role) }), text: fill(L.bs_roleDiff, { a: add.length, r: rem.length }), items, danger: rem.length > 0, confirm: L.bs_roleOk,
      run: () => { this.act(() => D.empSave({ ...e, role, branch: this.scope(role) === 'all' ? null : branch, whs: role === e.role ? e.whs : [], cash: role === e.role ? e.cash : [] })); this.setState({ dlg: null }); this.toast(fill(L.bs_roleDone, { n: D.empName(e), r: this.roleName(role) })); } } });
  }
  pickOk() {
    const s = this.state, pk = s.pick, D = this.D, L = this.L, e = (D.store.emps || []).find(x => x.id === pk.id);
    if (pk.kind === 'role') { if (pk.role === e.role) return this.setState({ pick: null }); if (this.scope(pk.role) !== 'all' && !pk.branch) return; return this.roleConfirm(e, pk.role, pk.branch); }
    if (pk.branch === e.branch) return this.setState({ pick: null });
    this.act(() => D.empSave({ ...e, branch: pk.branch, whs: [], cash: [] })); this.setState({ pick: null }); this.toast(fill(L.bs_brDone, { n: D.empName(e), b: this.brName(pk.branch) }));
  }
  lastDirector(e) { return e.role === 'director' && (this.D.store.emps || []).filter(x => x.role === 'director' && x.status !== 'blocked').length <= 1; }
  askBlock(e) {
    const L = this.L, D = this.D;
    if (this.isSelf(e)) return this.rule(L.bs_rSelfT, L.bs_rSelfBlock);
    if (this.lastDirector(e)) return this.rule(L.bs_rLastDirT, L.bs_rLastDir);
    this.setState({ reason: '', rTried: false, dlg: { title: fill(L.bs_blockT, { n: D.empName(e) }), text: fill(L.bs_blockText, { s: (D.sessionsOf(D.empName(e)) || []).length }), items: [], danger: true, withReason: true, confirm: L.bs_blockOk,
      run: () => { const r = this.state.reason.trim(); if (!r) return this.setState({ rTried: true }); this.act(() => { D.empSave({ ...e, status: 'blocked', blockReason: r }); D.store.sess[D.empName(e)] = []; }); this.setState({ dlg: null }); this.toast(fill(L.rl_blocked, { n: D.empName(e) })); } } });
  }
  askUnblock(e) {
