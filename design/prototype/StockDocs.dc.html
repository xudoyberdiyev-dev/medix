<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="medix-data.js"></script></helmet>
<div style="display:flex;flex-direction:column;min-width:0;font-family:Inter,system-ui,sans-serif;color:#172B2A;font-size:14px;line-height:20px;font-variant-numeric:tabular-nums">
<sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
<div data-screen-label="{{ listTitle }}" style="display:flex;flex-direction:column;gap:16px;min-width:0">
  <dc-import name="PageHeader" title="{{ listTitle }}" count="{{ countLabel }}" primary="{{ hdrPrimary }}" hint-size="100%,34px"></dc-import>
  <div style="display:flex;flex-direction:column;gap:12px">
    <dc-import name="SavedViews" tabs="{{ views }}" hint-size="100%,38px"></dc-import>
    <dc-import name="FilterBar" query="{{ q }}" on-query="{{ setQ }}" search-ph="{{ searchPh }}" clear-label="{{ L.clear }}" filters="{{ noFilters }}" chip-labels="{{ noFilters }}" has-active="{{ false }}" narrow="{{ narrow }}" hint-size="100%,34px"></dc-import>
  </div>
  <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 1px 2px rgba(18,60,58,0.04);margin-top:-4px">
    <sc-if value="{{ showTable }}" hint-placeholder-val="{{ true }}"><dc-import name="DataTable" columns="{{ tColumns }}" rows="{{ tRows }}" all-state="none" scroll-x="{{ narrow }}" min-width="{{ tMinWidth }}" select-all-label="{{ L.selAll }}" row-actions-label="{{ L.rowActions }}" hint-size="100%,300px"></dc-import></sc-if>
    <sc-if value="{{ listEmpty }}"><dc-import name="EmptyState" icon="{{ emptyIcon }}" tone="neutral" title="{{ L.qt_emptyT }}" primary="{{ hdrPrimary }}" min-height="320" hint-size="100%,320px"></dc-import></sc-if>
  </div>
  <div style="height:64px"></div>
</div>
</sc-if>

<sc-if value="{{ isDoc }}" hint-placeholder-val="{{ false }}">
<div data-screen-label="{{ docTitle }}" style="display:flex;flex-direction:column;gap:16px;min-width:0">
  <dc-import name="DocumentHeader" parent-label="{{ listTitle }}" on-parent="{{ backToList }}" title="{{ docTitle }}" number="{{ dNumber }}" badge="{{ dBadge }}" status="{{ dStatus }}" steps="{{ dSteps }}" autosave="{{ autosave }}" primary="{{ dPrimary }}" more="{{ dMore }}" more-label="{{ L.p_more }}" hint-size="100%,88px"></dc-import>
  <sc-for list="{{ banners }}" as="b"><dc-import name="StatusBanner" tone="{{ b.tone }}" icon="{{ b.icon }}" title="{{ b.title }}" text="{{ b.text }}" hint-size="100%,48px"></dc-import></sc-for>
  <sc-for list="{{ notices }}" as="n"><div style="display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border:1px solid #FECACA;border-radius:10px;background:#FFFFFF;font-size:13px;line-height:20px;color:#172B2A"><lucide-i name="shield-alert" size="16" style="color:#B91C1C;flex:none;margin-top:2px"></lucide-i><span style="text-wrap:pretty">{{ n.text }}</span></div></sc-for>
  <dc-import name="SavedViews" tabs="{{ docTabs }}" hint-size="100%,38px"></dc-import>

  <sc-if value="{{ tabDoc }}" hint-placeholder-val="{{ true }}">
    <sc-if value="{{ headEditable }}" hint-placeholder-val="{{ true }}">
      <section style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 1px 2px rgba(18,60,58,0.04);padding:20px 24px;display:grid;grid-template-columns:repeat({{ headCols }},minmax(0,1fr));gap:16px 20px;align-items:start">
        <sc-for list="{{ headSelects }}" as="f">
          <div style="display:flex;flex-direction:column;gap:6px;min-width:0;grid-column:{{ f.span }}">
            <dc-import name="Select" label="{{ f.label }}" required="{{ f.required }}" options="{{ f.options }}" value="{{ f.value }}" on-change="{{ f.onChange }}" placeholder="{{ L.qt_choose }}" searchable="{{ f.searchable }}" search-ph="{{ L.qt_search }}" empty-label="{{ f.emptyLabel }}" error="{{ f.error }}" locked="{{ f.locked }}" lock-tip="{{ f.lockTip }}" hint-size="100%,56px"></dc-import>
            <sc-if value="{{ f.hint }}"><span style="font-size:12px;line-height:16px;color:#5B6B6A">{{ f.hint }}</span></sc-if>
          </div>
        </sc-for>
        <sc-for list="{{ headInputs }}" as="f">
          <label style="display:flex;flex-direction:column;gap:6px;min-width:0">
            <span style="font-size:12px;line-height:16px;font-weight:500">{{ f.label }}</span>
            <input value="{{ f.value }}" onChange="{{ f.onChange }}" placeholder="{{ f.ph }}" style="height:34px;padding:0 12px;border:1px solid #E2E8F0;border-radius:8px;background:#FFFFFF;font-family:{{ f.font }};font-size:{{ f.size }};color:#172B2A;outline:none" style-hover="border-color:#CBD5D3" style-focus="border-color:#0F766E;box-shadow:0 0 0 3px rgba(13,148,136,0.15)">
          </label>
        </sc-for>
        <sc-if value="{{ hasCommission }}">
          <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px">
            <span style="font-size:12px;line-height:16px;font-weight:500">{{ L.qt_commission }} <span style="color:#B91C1C">*</span> <span style="font-weight:400;color:#647574">· {{ L.qt_commissionMin }}</span></span>
            <div style="display:flex;flex-wrap:wrap;gap:6px">
              <sc-for list="{{ staff }}" as="m"><button onClick="{{ m.toggle }}" aria-pressed="{{ m.on }}" style="display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid {{ m.border }};border-radius:16px;background:{{ m.bg }};color:{{ m.fg }};font-size:13px;font-weight:500;cursor:pointer"><lucide-i name="{{ m.icon }}" size="14"></lucide-i>{{ m.name }}</button></sc-for>
            </div>
            <sc-if value="{{ commErr }}"><span style="display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:#B91C1C"><lucide-i name="circle-alert" size="14"></lucide-i>{{ commErr }}</span></sc-if>
          </div>
        </sc-if>
        <sc-if value="{{ hasFile }}">
          <div style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px">
            <span style="font-size:12px;line-height:16px;font-weight:500">{{ L.qt_file }}<sc-if value="{{ fileReq }}"> <span style="color:#B91C1C">*</span></sc-if></span>
            <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
              <label style="display:flex;align-items:center;gap:8px;height:34px;padding:0 12px;border:1px dashed {{ fileBorder }};border-radius:8px;font-size:13px;color:#0F766E;cursor:pointer;background:#FFFFFF" style-hover="background:#F8FAFA"><lucide-i name="paperclip" size="16"></lucide-i>{{ L.qt_fileBtn }}<input type="file" accept="image/*,.pdf" onChange="{{ onFile }}" style="display:none"></label>
              <sc-if value="{{ fileName }}"><span style="display:flex;align-items:center;gap:6px;font-size:13px"><lucide-i name="file-check" size="16" style="color:#15803D"></lucide-i>{{ fileName }} <span style="color:#647574">· {{ fileSize }}</span><button onClick="{{ clearFile }}" aria-label="×" style="width:24px;height:24px;border:0;border-radius:6px;background:transparent;color:#647574;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:#FEF2F2;color:#B91C1C"><lucide-i name="x" size="14"></lucide-i></button></span></sc-if>
              <sc-if value="{{ fileErr }}"><span style="display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:#B91C1C"><lucide-i name="circle-alert" size="14"></lucide-i>{{ fileErr }}</span></sc-if>
            </div>
          </div>
        </sc-if>
        <label style="grid-column:1/-1;display:flex;flex-direction:column;gap:6px">
          <span style="font-size:12px;line-height:16px;font-weight:500">{{ L.qt_note }}</span>
          <textarea value="{{ dNote }}" onChange="{{ onNote }}" rows="2" style="padding:7px 12px;border:1px solid #E2E8F0;border-radius:8px;background:#FFFFFF;font:inherit;font-size:14px;line-height:20px;color:#172B2A;resize:vertical;outline:none" style-hover="border-color:#CBD5D3" style-focus="border-color:#0F766E;box-shadow:0 0 0 3px rgba(13,148,136,0.15)"></textarea>
        </label>
      </section>
    </sc-if>
    <sc-if value="{{ headRead }}"><dc-import name="InfoGrid" title="{{ L.qt_head }}" rows="{{ headRows }}" hint-size="100%,240px"></dc-import></sc-if>

    <section style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 1px 2px rgba(18,60,58,0.04)">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid #EEF2F4">
        <span style="display:flex;align-items:baseline;gap:8px"><span style="font-size:14px;font-weight:600">{{ L.qt_lines }}</span><span style="font-size:13px;color:#647574">{{ lineCount }}</span></span>
        <span style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
          <sc-if value="{{ hasErrNote }}"><span style="display:flex;align-items:center;gap:4px;font-size:12px;color:#B91C1C"><lucide-i name="circle-x" size="14"></lucide-i>{{ errNote }}</span></sc-if>
          <sc-if value="{{ hasWarnNote }}"><span style="display:flex;align-items:center;gap:4px;font-size:12px;color:#B45309"><lucide-i name="triangle-alert" size="14"></lucide-i>{{ warnNote }}</span></sc-if>
          <sc-if value="{{ canAddExpired }}"><button onClick="{{ addExpired }}" style="display:flex;align-items:center;gap:6px;padding:0;border:0;background:transparent;color:#0F766E;font-size:13px;font-weight:500;cursor:pointer" style-hover="color:#0F766E;text-decoration:underline"><lucide-i name="calendar-x" size="16"></lucide-i>{{ L.qt_addExpired }}</button></sc-if>
        </span>
      </div>
      <dc-import name="DocumentLinesGrid" columns="{{ gCols }}" rows="{{ gRows }}" options="{{ gOpts }}" editable="{{ editable }}" on-edit="{{ onEdit }}" on-add="{{ addLine }}" on-remove="{{ removeLine }}" on-barcode="{{ onBarcode }}" labels="{{ gLabels }}" hint-size="100%,260px"></dc-import>
      <dc-import name="TotalsFooter" items="{{ totItems }}" total-label="{{ totLabel }}" total-value="{{ totValue }}" bottom="{{ -24 }}" hint-size="100%,52px"></dc-import>
    </section>
  </sc-if>
  <sc-if value="{{ tabHist }}" hint-placeholder-val="{{ false }}">
    <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 1px 2px rgba(18,60,58,0.04);padding:20px 24px"><dc-import name="HistoryTimeline" groups="{{ histGroups }}" empty-label="{{ L.qt_histEmpty }}" hint-size="100%,240px"></dc-import></div>
  </sc-if>
  <div style="height:64px"></div>
</div>
</sc-if>

<sc-if value="{{ vsOpen }}"><dc-import name="ValidationSummary" title="{{ vsTitle }}" subtitle="{{ L.qt_vsSub }}" errors="{{ vsErrors }}" warnings="{{ vsWarnings }}" warn-title="{{ L.qt_vsWarn }}" close-label="{{ L.qt_close }}" on-close="{{ closeVs }}" hint-size="0px,0px"></dc-import></sc-if>
<sc-if value="{{ dlgOpen }}"><dc-import name="ConfirmDialog" title="{{ dlg.title }}" text="{{ dlg.text }}" items="{{ dlg.items }}" with-reason="{{ dlg.withReason }}" reason-label="{{ L.qt_reasonCancel }}" reason="{{ reason }}" reason-error="{{ reasonErr }}" on-reason="{{ onReason }}" danger="{{ dlg.danger }}" confirm-label="{{ dlg.confirm }}" cancel-label="{{ L.qt_back }}" on-confirm="{{ dlg.run }}" on-cancel="{{ closeDlg }}" hint-size="0px,0px"></dc-import></sc-if>
<sc-if value="{{ blockOpen }}">
  <div onClick="{{ closeDlg }}" style="position:fixed;inset:0;z-index:180;background:rgba(18,43,42,0.30);display:flex;align-items:center;justify-content:center;padding:24px">
    <div role="alertdialog" aria-modal="true" onClick="{{ stop }}" style="width:480px;max-width:100%;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;box-shadow:0 8px 24px rgba(18,60,58,0.12);padding:24px;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;gap:12px;align-items:flex-start">
        <span style="width:32px;height:32px;flex:none;border-radius:50%;background:#FEF2F2;color:#B91C1C;display:flex;align-items:center;justify-content:center"><lucide-i name="ban" size="18"></lucide-i></span>
        <div style="display:flex;flex-direction:column;gap:8px"><h2 style="margin:0;font-size:17px;line-height:24px;font-weight:600">{{ L.qt_blockT }}</h2>
          <sc-for list="{{ blockItems }}" as="b"><p style="margin:0;font-size:14px;line-height:20px;color:#5B6B6A;text-wrap:pretty">{{ b.text }}</p></sc-for>
          <p style="margin:0;font-size:13px;line-height:18px;color:#172B2A">{{ L.qt_blockHint }}</p>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end"><button onClick="{{ closeDlg }}" style="height:34px;padding:0 16px;border:0;border-radius:8px;background:#0F766E;color:#FFFFFF;font-size:14px;font-weight:500;cursor:pointer" style-hover="background:#115E59">{{ L.qt_understood }}</button></div>
    </div>
  </div>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;qm&quot;,&quot;hc&quot;,&quot;qy&quot;],&quot;default&quot;:&quot;qm&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dict&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;operator&quot;,&quot;keeper&quot;,&quot;purchase&quot;,&quot;branch&quot;,&quot;director&quot;,&quot;admin&quot;],&quot;default&quot;:&quot;branch&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;branch&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;TSH&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bekzod Tursunov&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;demo&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{k,n}&quot;},&quot;narrow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onToast&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(t)=&gt;void&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(k)=&gt;void&quot;}}">
const fN = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const fM = n => { const [a, b] = (Math.round(Math.abs(n) * 100) / 100).toFixed(2).split('.'); return (n < 0 ? '−' : '') + fN(+a) + ',' + b; };
const fill = (t, o) => String(t || '').replace(/\{(\w+)\}/g, (_, k) => o[k] != null ? o[k] : '');
const fSize = b => b > 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.round(b / 1024) + ' KB';
const ST = { draft: ['file-pen', '#5B6B6A', '#F8FAFA'], pending: ['clock', '#B45309', '#FFFBEB'], posted: ['circle-check', '#15803D', '#F0FDF4'], cancelled: ['circle-x', '#5B6B6A', '#EEF2F4'] };
const ICON = { qm: 'undo-2', hc: 'package-minus', qy: 'rotate-ccw' };
const ZICON = { store: 'boxes', ctrl: 'lock-keyhole', cold: 'snowflake', quar: 'shield-alert', recv: 'package-open' };
const ini = n => String(n || '').split(' ').map(w => w[0]).join('').slice(0, 2);
class Component extends DCLogic {
  state = { view: 'list', tab: 'all', q: '', d: null, docTab: 'doc', save: null, savedAt: null, tried: false, vs: null, dlg: null, reason: '', reasonErr: '', ready: !!window.MedixData };
  get D() { return window.MedixData; }
  get L() { return this.props.dict || {}; }
  get K() { return this.props.kind || 'qm'; }
  componentDidMount() {
    if (!this.D) this._p = setInterval(() => { if (this.D) { clearInterval(this._p); this.setState({ ready: true }); this.boot(); } }, 60); else this.boot();
    this._poll = setInterval(() => { const D = this.D; if (D && D.store.v !== this._v) { this._v = D.store.v; this.forceUpdate(); } }, 400);
    this._url = setInterval(() => this.applyUrl(), 250);
  }
  componentWillUnmount() { clearInterval(this._p); clearInterval(this._poll); clearInterval(this._url); clearTimeout(this._sv); }
  // T10a3 (1.7.4): manzildagi filtr — ?status=draft|pending|posted|cancelled, ?q=, ?open=
  applyUrl() { const D = this.D, u = D && D.store.urlF, pg = { qm: 'creturns', hc: 'writeoff', qy: 'sreturns' }[this.K]; if (!u || u.page !== pg || u.n === this._un || this.props.demo) return; this._un = u.n; const P = u.params || {};
    if (P.open) { const r = D.store.docReq; if (r && r.kind === this.K && r.openNo === P.open) D.store.docReq = null; const x = D.docByNo(this.K, P.open); if (x) return this.openDoc(x); }
    this.setState({ view: 'list', d: null, tab: ['draft', 'pending', 'posted', 'cancelled'].includes(P.status) ? P.status : 'all', q: P.q || '' }); }
  componentDidUpdate(pp) { const d = this.props.demo; if ((d && (!pp.demo || pp.demo.n !== d.n)) || pp.kind !== this.props.kind) this.boot(); }
  boot() {
    const D = this.D, d = this.props.demo; if (!D) return;
    const req = D.store.docReq; if (req && req.kind === this.K && !d) { D.store.docReq = null; if (req.openNo) return this.openDoc(D.docByNo(this.K, req.openNo)); return this.openNew(req); }
    if (!d) return this.setState({ view: 'list', d: null });
    D.docsReset(); const k = d.k, byNo = no => this.openDoc(D.docByNo(this.K, no));
    if (k === 'list') return this.setState({ view: 'list', d: null, tab: 'all' });
    if (k === 'new') return this.openNew({});
    if (k === 'over') return byNo('QM-TSH-000011');
    if (k === 'cold') return this.openNew({ cust: 17, saleNo: 'SV-TSH-000209', set: { 'NovoRapid FlexPen': [5, 'Shikastlangan'] } });
    if (k === 'posted') return byNo({ qm: 'QM-TSH-000009', hc: 'HC-TSH-000005', qy: 'QY-TSH-000002' }[this.K]);
    if (k === 'noCancel') { byNo('QM-TSH-000007'); return setTimeout(() => this.tryCancel(), 50); }
    if (k === 'normal') return byNo(this.K === 'hc' ? 'HC-TSH-000007' : 'QY-TSH-000004');
    if (k === 'expired') { this.openNew({}); return setTimeout(() => this.addExpired(), 50); }
    if (k === 'ctrl') return this.openNew({ names: [['Demidrol 1% 1ml', 10]], reason: 'Shikastlangan' });
    if (k === 'director') return this.openNew({ names: [['Ketorolak 30mg 1ml', 420]], reason: 'Shikastlangan', commission: [D.KEEPER, D.empNames('branch', 'TSH')[0]] });
    if (k === 'qyOver') { const x = D.docCopy(D.docByNo('qy', 'QY-TSH-000004')); x.lines.forEach(l => { if (l.qty) l.qty = l.qty * 20; }); return this.openDoc(x); }
  }
  blank() {
    const p = this.props, D = this.D, br = p.branch && p.branch !== 'ALL' ? p.branch : 'TSH', at = D.nowStr();
    const b = { kind: this.K, no: null, id: null, branch: br, wh: this.K === 'qy' ? '' : 'Asosiy ombor', date: D.TODAY, status: 'draft', note: '', lines: [], createdBy: p.userName, createdAt: at, log: [{ kind: 'create', who: p.userName, at }] };
    if (this.K === 'qm') Object.assign(b, { cust: null, saleNo: null });
    if (this.K === 'hc') Object.assign(b, { reason: null, commission: [], actNo: '', file: null });
    if (this.K === 'qy') Object.assign(b, { supplier: null, receiptNo: null, reason: null });
    return b;
  }
  openNew(req) {
    const D = this.D, d = this.blank();
    if (this.K === 'qm' && req.saleNo) { d.cust = req.cust; d.saleNo = req.saleNo; d.lines = D.qmLinesFor(req.saleNo); if (req.set) d.lines.forEach(l => { const s = req.set[(D.prodById(l.pid) || {}).name]; if (s) { l.qty = s[0]; l.reason = s[1]; } }); }
    if (this.K === 'hc') {
      if (req.wh) d.wh = req.wh; if (req.reason) d.reason = req.reason; if (req.commission) d.commission = req.commission;
      const bs = D.whBatches(d.branch, d.wh);
      (req.bids || []).forEach(id => { const b = D.batches().find(x => x.id === id); if (b) { d.wh = b.wh; d.lines.push(this.hcLine(b, Math.max(0, b.qty - b.reservedQty))); } });
      (req.names || []).forEach(([n, q]) => { const b = bs.find(x => x.p && x.p.name === n && x.qty - x.reservedQty > 0); if (b) d.lines.push(this.hcLine(b, q)); });
      if (req.expired) this._addExp = true;
      (req.lines || []).forEach(l => d.lines.push({ ...l })); if (req.actNo) d.actNo = req.actNo; if (req.note) d.note = req.note; if (req.branch) d.branch = req.branch;
    }
    if (this.K === 'qy' && req.receiptNo) { const rc = D.store.receipts.find(r => r.no === req.receiptNo); if (rc) { d.supplier = rc.supplier; d.receiptNo = rc.no; d.wh = rc.wh; d.lines = D.qyLinesFor(rc.no); if (req.bid) { const b = D.batches().find(x => x.id === req.bid); d.lines.forEach(l => { if (b && l.pid === b.pid && l.batch === b.batch) { l.bid = b.id; l.qty = Math.max(0, b.qty - b.reservedQty); } }); } } }
    this.setState({ view: 'doc', d, docTab: 'doc', save: null, savedAt: null, tried: false, vs: null, dlg: null }, () => { if (this._addExp) { this._addExp = false; this.addExpired(); } else if (d.lines.length) this.persist(d); });
  }
  openDoc(doc) { if (!doc) return; this.setState({ view: 'doc', d: this.D.docCopy(doc), docTab: 'doc', save: null, savedAt: null, tried: false, vs: null, dlg: null }); }
  trLeft(l) { const D = this.D, x = D.trByNo(l.transit), k = +String(l.bid).split('-').pop(), z = x ? D.trShort(x).find(y => y.k === k) : null; return z ? z.left : 0; }
  hcLine(b, q) { return { id: 'h' + b.id + '-' + Date.now() % 100000, bid: b.id, pid: b.pid, batch: b.batch, zone: b.zoneLabel, exp: b.exp, cost: b.cost, qty: q }; }
  toast(t) { this.props.onToast && this.props.onToast(t); }
  persist(d) {
