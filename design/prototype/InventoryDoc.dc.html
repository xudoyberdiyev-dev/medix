<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="medix-data.js"></script></helmet>
<div data-screen-label="{{ screenLabel }}" style="display:flex;flex-direction:column;gap:16px;min-width:0;font-family:Inter,system-ui,sans-serif;color:#172B2A;font-size:14px;line-height:20px;font-variant-numeric:tabular-nums">
  <dc-import name="DocumentHeader" parent-label="{{ L.iv_title }}" on-parent="{{ back }}" title="{{ title }}" number="{{ dNumber }}" badge="{{ dBadge }}" status="{{ dStatus }}" steps="{{ dSteps }}" sub="{{ dSub }}" autosave="{{ autosave }}" primary="{{ dPrimary }}" secondary="{{ dSecondary }}" more="{{ dMore }}" more-label="{{ L.p_more }}" hint-size="100%,88px"></dc-import>
  <sc-for list="{{ banners }}" as="b"><dc-import name="StatusBanner" tone="{{ b.tone }}" icon="{{ b.icon }}" title="{{ b.title }}" text="{{ b.text }}" hint-size="100%,48px"></dc-import></sc-for>
  <dc-import name="SavedViews" tabs="{{ docTabs }}" hint-size="100%,38px"></dc-import>

  <sc-if value="{{ tabDoc }}" hint-placeholder-val="{{ true }}">
    <sc-if value="{{ isDraft }}" hint-placeholder-val="{{ true }}">
      <section style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 1px 2px rgba(18,60,58,0.04);padding:20px 24px;display:flex;flex-direction:column;gap:20px">
        <div style="display:grid;grid-template-columns:repeat({{ headCols }},minmax(0,1fr));gap:16px 20px;align-items:start">
          <dc-import name="Select" label="{{ L.iv_hWh }}" required="{{ true }}" options="{{ whOpts }}" value="{{ whVal }}" on-change="{{ setWh }}" placeholder="{{ L.qt_choose }}" error="{{ whErr }}" hint-size="100%,56px"></dc-import>
          <label style="display:flex;flex-direction:column;gap:6px;min-width:0">
            <span style="font-size:12px;line-height:16px;font-weight:500">{{ L.qt_hDate }}</span>
            <input value="{{ dDate }}" onChange="{{ onDate }}" placeholder="kk.oo.yyyy" style="height:34px;padding:0 12px;border:1px solid #E2E8F0;border-radius:8px;background:#FFFFFF;font:inherit;font-size:14px;color:#172B2A;outline:none" style-focus="border-color:#0F766E;box-shadow:0 0 0 3px rgba(13,148,136,0.15)">
          </label>
          <div style="display:flex;flex-direction:column;gap:6px;min-width:0">
            <span style="font-size:12px;line-height:16px;font-weight:500">{{ L.iv_hMode }}</span>
            <div style="display:flex;gap:2px;padding:2px;border-radius:8px;background:#EEF2F4">
              <sc-for list="{{ modes }}" as="m"><button onClick="{{ m.pick }}" aria-pressed="{{ m.on }}" style="flex:1;height:30px;padding:0 8px;border:0;border-radius:6px;background:{{ m.bg }};box-shadow:{{ m.sh }};color:{{ m.fg }};font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap">{{ m.label }}</button></sc-for>
            </div>
          </div>
        </div>
        <sc-if value="{{ showZones }}">
          <div style="display:flex;flex-direction:column;gap:6px">
            <span style="font-size:12px;line-height:16px;font-weight:500">{{ L.iv_hZones }}<sc-if value="{{ zonesReq }}"> <span style="color:#B91C1C">*</span></sc-if></span>
            <div style="display:flex;flex-wrap:wrap;gap:6px">
              <sc-for list="{{ zoneChips }}" as="z"><button onClick="{{ z.toggle }}" aria-pressed="{{ z.on }}" title="{{ z.tip }}" style="display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid {{ z.border }};border-radius:16px;background:{{ z.bg }};color:{{ z.fg }};font-size:13px;font-weight:500;cursor:pointer"><lucide-i name="{{ z.icon }}" size="14"></lucide-i>{{ z.label }}<span style="color:#647574;font-weight:400">{{ z.n }}</span></button></sc-for>
            </div>
            <sc-if value="{{ zoneErr }}"><span style="font-size:12px;line-height:16px;color:#B91C1C">{{ zoneErr }}</span></sc-if>
          </div>
        </sc-if>
        <sc-if value="{{ showProducts }}">
          <div style="display:grid;grid-template-columns:repeat({{ prodCols }},minmax(0,1fr));gap:16px 20px;align-items:start">
            <dc-import name="Select" label="{{ L.iv_hAddProd }}" required="{{ true }}" options="{{ prodOpts }}" value="{{ none }}" on-change="{{ addProd }}" placeholder="{{ L.iv_pickProd }}" searchable="{{ true }}" search-ph="{{ L.qt_search }}" error="{{ prodErr }}" hint-size="100%,56px"></dc-import>
            <dc-import name="Select" label="{{ L.iv_hCat }}" options="{{ catOpts }}" value="{{ none }}" on-change="{{ addCat }}" placeholder="{{ L.iv_pickCat }}" hint-size="100%,56px"></dc-import>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            <sc-for list="{{ prodChips }}" as="c"><span style="display:flex;align-items:center;gap:4px;height:30px;padding:0 4px 0 10px;border:1px solid #0D9488;border-radius:15px;background:#DDF5EE;color:#0F766E;font-size:13px;font-weight:500">{{ c.label }}<button onClick="{{ c.remove }}" aria-label="{{ L.p_fRemove }}" style="width:22px;height:22px;border:0;border-radius:11px;background:transparent;color:#0F766E;display:flex;align-items:center;justify-content:center;cursor:pointer" style-hover="background:rgba(13,148,136,0.15)"><lucide-i name="x" size="14"></lucide-i></button></span></sc-for>
          </div>
        </sc-if>
        <div style="display:flex;flex-direction:column;gap:6px">
          <span style="font-size:12px;line-height:16px;font-weight:500">{{ L.iv_hComm }} <span style="color:#B91C1C">*</span> <span style="font-weight:400;color:#647574">· {{ L.iv_commHint }}</span></span>
          <div style="display:flex;flex-wrap:wrap;gap:6px">
            <sc-for list="{{ staff }}" as="m"><button onClick="{{ m.toggle }}" aria-pressed="{{ m.on }}" style="display:flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:1px solid {{ m.border }};border-radius:16px;background:{{ m.bg }};color:{{ m.fg }};font-size:13px;font-weight:500;cursor:pointer"><lucide-i name="{{ m.icon }}" size="14"></lucide-i>{{ m.name }}<sc-if value="{{ m.isChair }}"><span style="height:18px;padding:0 6px;border-radius:5px;background:#0F766E;color:#FFFFFF;font-size:11px;line-height:18px">{{ L.iv_chair }}</span></sc-if></button></sc-for>
          </div>
          <sc-if value="{{ hasChairPick }}">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:#5B6B6A">{{ L.iv_chairPick }}
              <sc-for list="{{ chairOpts }}" as="c"><button onClick="{{ c.pick }}" style="height:26px;padding:0 8px;border:1px solid {{ c.border }};border-radius:6px;background:{{ c.bg }};color:{{ c.fg }};font-size:12.5px;cursor:pointer">{{ c.name }}</button></sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ commErr }}"><span style="font-size:12px;line-height:16px;color:#B91C1C">{{ commErr }}</span></sc-if>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:16px;border-top:1px solid #EEF2F4">
          <button onClick="{{ toggleBlind }}" role="switch" aria-checked="{{ blind }}" style="display:flex;align-items:center;gap:10px;padding:0;border:0;background:transparent;cursor:pointer;text-align:left">
            <span style="width:36px;height:20px;flex:none;border-radius:10px;background:{{ blindBg }};position:relative"><span style="position:absolute;top:2px;left:{{ blindX }};width:16px;height:16px;border-radius:8px;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,0.2)"></span></span>
            <span style="display:flex;flex-direction:column"><span style="font-size:13px;font-weight:500">{{ L.iv_blind }}</span><span style="font-size:12px;line-height:16px;color:#5B6B6A">{{ blindHint }}</span></span>
          </button>
          <span style="display:flex;align-items:center;gap:6px;font-size:13px;color:#5B6B6A"><lucide-i name="list-checks" size="16"></lucide-i>{{ scopeNote }}</span>
        </div>
      </section>
    </sc-if>
    <sc-if value="{{ headRead }}"><dc-import name="InfoGrid" title="{{ L.qt_head }}" rows="{{ headRows }}" hint-size="100%,160px"></dc-import></sc-if>

    <sc-if value="{{ hasLines }}">
      <section style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 1px 2px rgba(18,60,58,0.04);min-width:0">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid #EEF2F4">
          <dc-import name="SavedViews" tabs="{{ lineTabs }}" hint-size="420px,34px"></dc-import>
          <sc-if value="{{ canNewBatch }}"><button onClick="{{ openNewB }}" style="display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border:1px solid #E2E8F0;border-radius:8px;background:#FFFFFF;font-size:13px;font-weight:500;cursor:pointer" style-hover="background:#F8FAFA"><lucide-i name="plus" size="16" style="color:#0F766E"></lucide-i>{{ L.iv_newBatch }}</button></sc-if>
        </div>
        <sc-if value="{{ newBOpen }}">
          <div style="padding:16px;border-bottom:1px solid #EEF2F4;background:#F8FAFA;display:flex;flex-direction:column;gap:12px">
            <span style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600"><lucide-i name="package-plus" size="16" style="color:#0F766E"></lucide-i>{{ L.iv_newBatchT }}<span style="font-weight:400;color:#5B6B6A">· {{ L.iv_newBatchD }}</span></span>
            <div style="display:grid;grid-template-columns:repeat({{ nbCols }},minmax(0,1fr));gap:12px;align-items:start">
              <dc-import name="Select" label="{{ L.qt_gProduct }}" required="{{ true }}" options="{{ nbProdOpts }}" value="{{ nb.pid }}" on-change="{{ nbProd }}" placeholder="{{ L.iv_pickProd }}" searchable="{{ true }}" search-ph="{{ L.qt_search }}" error="{{ nbErr.pid }}" hint-size="100%,56px"></dc-import>
              <sc-for list="{{ nbInputs }}" as="f">
                <label style="display:flex;flex-direction:column;gap:6px;min-width:0">
                  <span style="font-size:12px;line-height:16px;font-weight:500">{{ f.label }} <span style="color:#B91C1C">*</span></span>
                  <input value="{{ f.value }}" onChange="{{ f.onChange }}" placeholder="{{ f.ph }}" inputMode="{{ f.mode }}" style="height:34px;padding:0 10px;border:1px solid {{ f.border }};border-radius:8px;background:#FFFFFF;font-family:{{ f.font }};font-size:13px;color:#172B2A;outline:none;min-width:0" style-focus="border-color:#0F766E;box-shadow:0 0 0 3px rgba(13,148,136,0.15)">
                  <sc-if value="{{ f.hint }}"><span style="font-size:12px;line-height:16px;color:{{ f.hintC }}">{{ f.hint }}</span></sc-if>
                </label>
              </sc-for>
              <dc-import name="Select" label="{{ L.iv_cZone }}" required="{{ true }}" options="{{ nbZoneOpts }}" value="{{ nb.zone }}" on-change="{{ nbZone }}" placeholder="{{ L.qt_choose }}" error="{{ nbErr.zone }}" hint-size="100%,56px"></dc-import>
            </div>
            <div style="display:flex;gap:8px;justify-content:flex-end">
              <button onClick="{{ closeNewB }}" style="height:34px;padding:0 14px;border:1px solid #E2E8F0;border-radius:8px;background:#FFFFFF;font-size:13px;font-weight:500;cursor:pointer" style-hover="background:#F8FAFA">{{ L.qt_back }}</button>
              <button onClick="{{ saveNewB }}" style="height:34px;padding:0 14px;border:0;border-radius:8px;background:#0F766E;color:#FFFFFF;font-size:13px;font-weight:500;cursor:pointer" style-hover="background:#115E59">{{ L.iv_addLine }}</button>
            </div>
          </div>
        </sc-if>
        <dc-import name="DataTable" columns="{{ tColumns }}" rows="{{ tRows }}" all-state="{{ allState }}" on-toggle-all="{{ toggleAll }}" scroll-x="{{ true }}" min-width="{{ tMinW }}" select-all-label="{{ L.selAll }}" row-actions-label="{{ L.rowActions }}" hint-size="100%,300px"></dc-import>
        <sc-if value="{{ noLines }}"><div style="padding:32px 16px;text-align:center;font-size:13px;color:#5B6B6A">{{ L.iv_noDiff }}</div></sc-if>
        <sc-if value="{{ showTotals }}"><dc-import name="TotalsFooter" items="{{ totItems }}" total-label="{{ L.iv_tNet }}" total-value="{{ totNet }}" bottom="{{ -24 }}" hint-size="100%,52px"></dc-import></sc-if>
      </section>
    </sc-if>
    <sc-if value="{{ hasSel }}"><div style="position:sticky;bottom:72px;z-index:6;display:flex;justify-content:center"><dc-import name="BulkBar" count-label="{{ selLabel }}" actions="{{ bulkActions }}" on-clear="{{ clearSel }}" clear-label="{{ L.cancelSel }}" hint-size="420px,44px"></dc-import></div></sc-if>
  </sc-if>
  <sc-if value="{{ tabHist }}" hint-placeholder-val="{{ false }}">
    <div style="background:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 1px 2px rgba(18,60,58,0.04);padding:20px 24px"><dc-import name="HistoryTimeline" groups="{{ histGroups }}" empty-label="{{ L.qt_histEmpty }}" hint-size="100%,240px"></dc-import></div>
  </sc-if>
  <div style="height:48px"></div>

  <sc-if value="{{ vsOpen }}"><dc-import name="ValidationSummary" title="{{ vsTitle }}" subtitle="{{ L.qt_vsSub }}" errors="{{ vsErrors }}" warnings="{{ vsWarnings }}" warn-title="{{ L.qt_vsWarn }}" close-label="{{ L.qt_close }}" on-close="{{ closeVs }}" hint-size="0px,0px"></dc-import></sc-if>
  <sc-if value="{{ dlgOpen }}"><dc-import name="ConfirmDialog" title="{{ dlg.title }}" text="{{ dlg.text }}" items="{{ dlg.items }}" with-reason="{{ dlg.withReason }}" reason-label="{{ dlg.reasonLabel }}" reason="{{ reason }}" reason-error="{{ reasonErr }}" on-reason="{{ onReason }}" danger="{{ dlg.danger }}" confirm-label="{{ dlg.confirm }}" cancel-label="{{ L.qt_back }}" on-confirm="{{ dlg.run }}" on-cancel="{{ closeDlg }}" hint-size="0px,0px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;no&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;req&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;act&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;docKey&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;dict&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;branch&quot;,&quot;keeper&quot;,&quot;director&quot;,&quot;admin&quot;,&quot;accountant&quot;],&quot;default&quot;:&quot;branch&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;branch&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;TSH&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Bekzod Tursunov&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;narrow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onBack&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onToast&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(t)=&gt;void&quot;},&quot;onCount&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(no)=&gt;void&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(k,a)=&gt;void&quot;}}">
const fN = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const fM = n => { const [a, b] = (Math.round(Math.abs(n || 0) * 100) / 100).toFixed(2).split('.'); return (n < 0 ? '−' : '') + fN(+a) + ',' + b; };
const fill = (t, o) => String(t || '').replace(/\{(\w+)\}/g, (_, k) => o[k] != null ? o[k] : '');
const ST = { draft: ['file-pen', '#5B6B6A', '#F8FAFA'], count: ['scan-line', '#1D4ED8', '#EFF6FF'], check: ['clipboard-list', '#B45309', '#FFFBEB'], posted: ['circle-check', '#15803D', '#F0FDF4'], cancelled: ['circle-x', '#5B6B6A', '#EEF2F4'] };
const ZICON = { store: 'boxes', ctrl: 'lock-keyhole', cold: 'snowflake', quar: 'shield-alert', recv: 'package-open' };
const ini = n => String(n || '').split(' ').map(w => w[0]).join('').slice(0, 2);
const reD = /^\d{2}\.\d{2}\.\d{4}$/;
class Component extends DCLogic {
  state = { x: null, docTab: 'doc', lineTab: 'all', sel: {}, tried: false, vs: null, dlg: null, reason: '', reasonErr: '', save: null, savedAt: null, nb: null, nbTried: false };
  get D() { return window.MedixData; }
  get L() { return this.props.dict || {}; }
  componentDidMount() {
    if (!this.D) this._p = setInterval(() => { if (this.D) { clearInterval(this._p); this.load(); } }, 60); else this.load();
    this._poll = setInterval(() => { const D = this.D; if (D && D.store.v !== this._v) { this._v = D.store.v; const x = this.state.x; if (x && x.no && x.status !== 'draft') { const y = D.ivByNo(x.no); if (y && JSON.stringify(y) !== JSON.stringify(x)) return this.setState({ x: D.ivCopy(y) }); } this.forceUpdate(); } }, 400);
  }
  componentWillUnmount() { clearInterval(this._p); clearInterval(this._poll); clearTimeout(this._sv); }
  componentDidUpdate(pp) { if (pp.docKey !== this.props.docKey) this.load(); }
  my() { const b = this.props.branch; return b && b !== 'ALL' ? b : null; }
  toast(t) { this.props.onToast && this.props.onToast(t); }
  who(rs) { const L = this.L; return fill(L.qz_who, { r: rs.map(r => L['r_' + r] || r).join(', ') }); }
  load() {
    const D = this.D, p = this.props; if (!D) return;
    let x = p.no ? D.ivCopy(D.ivByNo(p.no)) : null;
    if (!x) { const at = D.nowStr(); x = { no: null, id: null, branch: this.my() || 'TSH', wh: 'Asosiy ombor', date: D.TODAY, scope: { mode: 'zones', zones: [], pids: [] }, commission: [], chair: '', blind: true, status: 'draft', lines: [], note: '', createdBy: p.userName, createdAt: at, log: [{ kind: 'create', who: p.userName, at }], ...(p.req || {}) }; }
    clearTimeout(this._sv);
    this.setState({ x, docTab: 'doc', lineTab: p.act === 'diff' ? 'diff' : 'all', sel: {}, tried: false, vs: null, dlg: null, save: null, nb: null, nbTried: false }, () => { if (p.act === 'newBatch') this.openNb(); if (p.act === 'post') setTimeout(() => this.tryPost(), 60); });
  }
  persist(x) { if (x.status !== 'draft') return; clearTimeout(this._sv); this.setState({ save: 'saving' }); this._sv = setTimeout(() => { const r = this.D.saveIv(this.state.x); this.setState(s => ({ x: { ...s.x, no: r.no, id: r.id }, save: 'saved', savedAt: this.D.nowStr().slice(11) })); }, 400); }
  upd(fn) { const x = JSON.parse(JSON.stringify(this.state.x)); fn(x); this.setState({ x }); this.persist(x); }
  updLines(fn) { const D = this.D, x = D.ivCopy(this.state.x); fn(x); const r = D.saveIv(x); this.setState({ x: r }); return r; }
  scopeN(x) { const D = this.D; return x.wh ? D.ivScope(x).length : 0; }
  startErrs(x) {
    const D = this.D, L = this.L, e = [];
    if (!x.wh) e.push({ k: 'wh', text: L.iv_eWh });
    if (x.scope.mode !== 'wh' && x.scope.mode === 'zones' && !x.scope.zones.length) e.push({ k: 'zones', text: L.iv_eZones });
    if (x.scope.mode === 'products' && !x.scope.pids.length) e.push({ k: 'pids', text: L.iv_ePids });
    if ((x.commission || []).length < 2) e.push({ k: 'comm', text: L.iv_eComm }); else if (!x.chair || !x.commission.includes(x.chair)) e.push({ k: 'comm', text: L.iv_eChair });
    if (x.wh && !this.scopeN(x)) e.push({ k: 'scope', text: L.iv_eEmpty });
    if (x.wh) { const zs = D.ivZones(x); zs.forEach(z => { const n = D.ivLock(x.branch, x.wh, z); if (n && n !== x.no) e.push({ k: 'zones', text: fill(L.iv_eBusy, { z: D.zoneType(x.branch, x.wh, z).label, n }) }); }); }
    return e;
  }
  tryStart() {
    const D = this.D, L = this.L, x = this.state.x, e = this.startErrs(x); clearTimeout(this._sv); this.setState({ tried: true });
    if (e.length) return this.setState({ vs: { errs: e } });
    const zs = D.ivZones(x).map(z => D.zoneType(x.branch, x.wh, z).label), n = this.scopeN(x), ord = D.ivWaitOrders(x).length;
    this.setState({ dlg: { type: 'start', items: [{ icon: 'lock', color: '#B45309', text: fill(L.iv_cfLock, { z: zs.join(', ') }) }, ...(ord ? [{ icon: 'clock', text: fill(L.iv_cfOrders, { n: ord }) }] : []), { icon: 'camera', text: fill(L.iv_cfSnap, { n }) }, { icon: x.blind ? 'eye-off' : 'eye', text: x.blind ? L.iv_cfBlind : L.iv_cfOpen }] } });
  }
  whProd(br, wh, pid) { let q = 0, c = 0, r = 0, a = 0; this.D.batches().forEach(b => { if (b.pid === pid && b.branch === br && b.wh === wh && b.qty > 0) { q += b.qty; c += b.closed || 0; r += b.reservedQty || 0; a += b.avail || 0; } }); return { q, c, r, a }; }
  tryPost() {
    const D = this.D, L = this.L, x = this.state.x, R = D.IV_ROLES, need = D.ivNeedsDir(x) ? R.approveDir : R.approve;
    const unc = x.lines.filter(l => l.counted == null); if (unc.length) return this.setState({ vs: { errs: unc.slice(0, 8).map(l => ({ text: fill(L.iv_eUnc, { p: (D.prodById(l.pid) || {}).name, b: l.batch }) })) } });
