<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>@keyframes rl-shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}</style></helmet>
<div style="height:100%;display:flex;flex-direction:column;min-height:0;font-family:Inter,system-ui,sans-serif;color:#172B2A;font-size:14px;line-height:20px;font-variant-numeric:tabular-nums">
  <div style="flex:1;min-height:0;overflow:auto;padding:32px 24px 24px;display:flex;flex-direction:column">
    <div style="flex:1;display:flex;flex-direction:column;gap:20px;min-width:0;padding-bottom:24px">
      <sc-if value="{{ wiz }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column">
        <span style="font-size:12px;line-height:16px;font-weight:500;color:#0F766E">{{ stepOf }}</span>
        <h1 style="margin:6px 0 0;font-size:26px;line-height:32px;font-weight:600;letter-spacing:-0.01em">{{ L.rl_t4 }}</h1>
        <p style="margin:8px 0 0;max-width:720px;font-size:14px;line-height:20px;color:#5B6B6A;text-wrap:pretty">{{ L.rl_d4 }}</p>
      </div></sc-if>
      <sc-if value="{{ pageMode }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:4px"><dc-import name="PageHeader" title="{{ L.n_roles }}" subtitle="{{ L.rl_d4 }}" hint-size="100%,52px"></dc-import><span style="font-size:13px;line-height:18px;color:#647574">{{ lastChange }}</span></div></sc-if>
      <sc-if value="{{ hasErr }}"><dc-import name="StatusBanner" tone="danger" icon="circle-alert" text="{{ errText }}" hint-size="100%,44px"></dc-import></sc-if>
      <div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:4px">
        <sc-for list="{{ cards }}" as="c" hint-placeholder-count="8">
          <button onClick="{{ c.pick }}" style="flex:none;width:228px;height:84px;box-sizing:border-box;padding:12px 14px;border:1px solid {{ c.bd }};border-radius:12px;background:{{ c.bg }};text-align:left;display:flex;flex-direction:column;gap:2px;cursor:pointer;font:inherit;color:inherit;opacity:{{ c.op }};transition:border-color 120ms ease-out,background 600ms ease-out" style-hover="border-color:#0F766E">
            <span style="display:flex;align-items:center;gap:6px;min-width:0">
              <span style="font-size:14px;line-height:20px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.name }}</span>

            </span>

        </sc-for>

        </div>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ dlgOpen }}">

  </sc-if>
  <sc-if value="{{ tipOpen }}">
    <div role="tooltip" style="position:fixed;left:{{ tip.x }}px;top:{{ tip.y }}px;z-index:190;transform:translate(-50%,-100%);max-width:260px;padding:6px 10px;border-radius:6px;background:#172B2A;color:#FFFFFF;font-size:12px;line-height:16px;box-shadow:0 8px 24px rgba(18,60,58,0.12);pointer-events:none">{{ tip.text }}</div>
  </sc-if>
  <sc-if value="{{ toastOpen }}">
    <div style="position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:180;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px 0 12px;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 8px 24px rgba(18,60,58,0.12);font-size:13px;white-space:nowrap">
      <span style="width:20px;height:20px;border-radius:50%;background:{{ toastBg }};color:{{ toastFg }};display:flex;align-items:center;justify-content:center"><lucide-i name="{{ toastIcon }}" size="12"></lucide-i></span>{{ toastText }}
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
