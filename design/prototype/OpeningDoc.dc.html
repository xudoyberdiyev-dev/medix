<!DOCTYPE html>

</div>
</x-dc>

    if (!D.canR(this.props.role, 'BQ_ROLES', 'approve')) return this.toast(this.who(R.approve));
    const sm = D.bqSum(x), items = [], bn = (D.BRANCHES.find(b => b.code === x.branch) || {}).name || x.branch;
    if (x.type === 'goods') { items.push({ icon: 'package-plus', color: '#15803D', text: fill(L.bq_cfGoods, { w: this.placeOf(x), n: fN(sm.n), q: fN(sm.qty), s: fM(sm.cost) }) }); if (sm.quar) items.push({ icon: 'shield-alert', color: '#B45309', text: fill(L.bq_cfQuar, { n: sm.quar }) }); const nw = x.lines.filter(l => l.warn && l.warn.length).length; if (nw) items.push({ icon: 'triangle-alert', color: '#B45309', text: fill(L.bq_cfWarn, { n: nw }) }); }

      if (sm.overdue) items.push({ icon: 'clock-alert', color: '#B45309', text: fill(L.bq_cfOd, { n: sm.overdue }) }); if (sm.adv) items.push({ icon: 'wallet', text: fill(L.bq_cfAdv, { n: sm.adv }) }); items.push({ icon: 'archive', text: L.bq_cfArch }); }
    if (x.type === 'cash') x.lines.forEach(l => { const a = D.accById(l.acct) || {}; items.push({ icon: a.kind === 'cash' ? 'banknote' : 'landmark', color: '#15803D', text: fill(L.bq_cfCash, { a: a.name || l.acct, s: fM(l.sum) }) }); });

  doPost() { const D = this.D, L = this.L, x = this.state.x.id ? this.state.x : D.saveBq(this.state.x), r = D.bqPost(x, this.props.userName); if (r.err) { this.setState({ dlg: null }); return this.checkDup(true); } this.setState({ x: r.doc, dlg: null, tried: false }); this.toast(fill(L.bq_tPosted, { n: r.doc.no })); }
