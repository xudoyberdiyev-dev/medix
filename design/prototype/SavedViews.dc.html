<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="tablist" style="display:flex;gap:24px;border-bottom:1px solid #E2E8F0;overflow-x:auto;scrollbar-width:none;font-family:Inter,system-ui,sans-serif">
  <sc-for list="{{ items }}" as="t" hint-placeholder-count="5">
    <button role="tab" aria-selected="{{ t.active }}" onClick="{{ t.pick }}" style="display:flex;align-items:center;gap:6px;height:38px;flex:none;padding:0 2px;margin-bottom:-1px;border:0;border-bottom:2px solid {{ t.line }};background:transparent;color:{{ t.color }};font-size:13px;font-weight:{{ t.weight }};cursor:pointer;white-space:nowrap;transition:color 120ms ease-out" style-hover="color:#172B2A">
      {{ t.label }}
      <sc-if value="{{ t.hasCount }}"><span style="height:18px;padding:0 6px;border-radius:6px;background:{{ t.pillBg }};color:{{ t.pillColor }};font-size:11.5px;line-height:18px;font-weight:500;font-variant-numeric:tabular-nums">{{ t.count }}</span></sc-if>
    </button>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:800,&quot;height&quot;:60},&quot;tabs&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{label,count?,active,pick}[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { items: (this.props.tabs || []).map(t => {
      const a = !!t.active;
      return { ...t, active: a, hasCount: t.count != null, line: a ? '#0D9488' : 'transparent', color: a ? '#172B2A' : '#5B6B6A', weight: a ? 500 : 400,
        pillBg: t.tone === 'warning' ? '#FFFBEB' : a ? '#DDF5EE' : '#EEF2F4', pillColor: t.tone === 'warning' ? '#B45309' : a ? '#0F766E' : '#5B6B6A' };
    }) };
  }
}
</script>
</body>
</html>
