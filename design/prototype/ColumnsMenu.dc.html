<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;font-family:Inter,system-ui,sans-serif">
  <button onClick="{{ toggle }}" aria-expanded="{{ open }}" style="display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:1px solid #E2E8F0;border-radius:8px;background:#FFFFFF;font-size:13px;font-weight:500;color:#172B2A;cursor:pointer;white-space:nowrap;transition:background 120ms ease-out" style-hover="background:#F8FAFA"><lucide-i name="columns-3" size="16" style="color:#5B6B6A"></lucide-i>{{ label }}<sc-if value="{{ hasHidden }}"><span style="height:18px;padding:0 6px;border-radius:6px;background:#EEF2F4;color:#5B6B6A;font-size:11.5px;line-height:18px">{{ shown }}</span></sc-if></button>
  <sc-if value="{{ open }}">
    <div onClick="{{ toggle }}" style="position:fixed;inset:0;z-index:40"></div>
    <div style="position:absolute;top:36px;right:0;width:240px;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:10px;box-shadow:0 8px 24px rgba(18,60,58,0.12);padding:4px;z-index:41">
      <sc-if value="{{ hasHint }}"><div style="padding:8px 10px 6px;font-size:12px;line-height:16px;color:#647574">{{ hint }}</div></sc-if>
      <sc-for list="{{ items }}" as="c">
        <button role="checkbox" aria-checked="{{ c.visible }}" onClick="{{ c.toggle }}" style="display:flex;align-items:center;gap:8px;width:100%;height:32px;padding:0 8px;border:0;border-radius:6px;background:transparent;font-size:13px;color:#172B2A;cursor:pointer;text-align:left" style-hover="background:#F8FAFA">
          <span style="width:16px;height:16px;flex:none;border-radius:4px;border:1px solid {{ c.cbBorder }};background:{{ c.cbBg }};color:#FFFFFF;display:flex;align-items:center;justify-content:center"><sc-if value="{{ c.visible }}"><lucide-i name="check" size="12"></lucide-i></sc-if></span>{{ c.label }}
        </button>
      </sc-for>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:300},&quot;columns&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{key,label,visible}[]&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(cols)=&gt;void&quot;},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Ustunlar&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false };
  renderVals() {
    const p = this.props, cols = p.columns || [], vis = cols.filter(c => c.visible).length;
    return { open: this.state.open, toggle: () => this.setState(s => ({ open: !s.open })), label: p.label || 'Ustunlar', hint: p.hint, hasHint: !!p.hint,
      hasHidden: vis < cols.length, shown: `${vis}/${cols.length}`,
      items: cols.map((c, i) => ({ label: c.label, visible: c.visible, cbBg: c.visible ? '#0F766E' : '#FFFFFF', cbBorder: c.visible ? '#0F766E' : '#647574',
        toggle: () => p.onChange && p.onChange(cols.map((x, j) => j === i ? { ...x, visible: !x.visible || vis === 1 } : x)) })) };
  }
}
</script>
</body>
</html>
