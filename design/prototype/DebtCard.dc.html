<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="medix-data.js"></script></helmet>
<div style="display:flex;flex-direction:column;min-width:0;font-family:Inter,system-ui,sans-serif;color:#172B2A;font-size:14px;line-height:20px;font-variant-numeric:tabular-nums">
<sc-if value="{{ isCard }}" hint-placeholder-val="{{ true }}">
<div data-screen-label="Qarz kartochkasi" style="display:flex;flex-direction:column;gap:16px;min-width:0">

          </div>
        </div>

    </div>
    <dc-import name="SideSummary" kpis="{{ kpis }}" columns="{{ kpiCols }}" bars-title="{{ barsTitle }}" bars="{{ bars }}" hint-size="100%,320px"></dc-import>
  </div>
  <div style="height:32px"></div>
</div>
</sc-if>
<sc-if value="{{ isAdv }}" hint-placeholder-val="{{ false }}">
  <dc-import name="AdvanceDoc" kind="{{ kind }}" party="{{ party }}" branch="{{ branchCode }}" no="{{ adv.no }}" act="{{ adv.act }}" doc-key="{{ adv.key }}" parent-label="{{ name }}" dict="{{ L }}" role="{{ role }}" user-name="{{ userName }}" narrow="{{ narrow }}" on-back="{{ advBack }}" on-toast="{{ toastFn }}" on-navigate="{{ navFn }}" hint-size="100%,700px"></dc-import>
</sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mt&quot;,&quot;yt&quot;],&quot;default&quot;:&quot;mt&quot;,&quot;tsType&quot;:&quot;'mt'|'yt'&quot;},&quot;party&quot;:{&quot;editor&quot;:null,&quot;default&quot;:2,&quot;tsType&quot;:&quot;number|string&quot;},&quot;branch&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;TSH&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;advOpen&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;advAct&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cardKey&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;backLabel&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Mijozlar qarzi&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dict&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cashier&quot;,&quot;accountant&quot;,&quot;branch&quot;,&quot;director&quot;,&quot;admin&quot;,&quot;operator&quot;],&quot;default&quot;:&quot;accountant&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Jasur Ergashev&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;readOnly&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;narrow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onBack&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;()=&gt;void&quot;},&quot;onToast&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(t)=&gt;void&quot;},&quot;onNavigate&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(k,arg)=&gt;void&quot;}}">
const fN = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.');

  state = { tab: 'open', from: '01.07.2026', to: '04.10.2026', adv: null };

    const L = this.L, s = this.state, D = this.D, p = this.props, narrow = !!p.narrow, K = p.kind === 'yt' ? 'yt' : 'mt', yt = K === 'yt';

    if (!D || !D.debtState || p.party == null) return base;
    const x = D.debtState(K, p.party, p.branch), Lg = x.L, br = x.branch, brName = (D.BRANCHES.find(b => b.code === br) || {}).name || br;

    if (s.tab === 'open') {

        { key: 'sum', label: L.qz_c_sum, width: '136px', align: 'right' }, { key: 'ret', label: L.qz_c_ret, width: '124px', align: 'right' }, { key: 'paid', label: L.qz_c_paid, width: '136px', align: 'right' }, { key: 'left', label: L.qz_c_left, width: '136px', align: 'right' }, { key: 'late', label: L.qz_c_late, width: '128px' }];
      tRows = open.map(v => ({ id: v.no, onOpen: () => openDoc({ ...v, t: v.rc ? 'rc' : v.open ? 'arch' : 'sale', archive: !!v.open }), onToggle: () => {},
        cells: [v.open ? { type: 'name', text: v.no, badge: L.qz_arch, sub: L.qz_archSub, weight: 500 } : { type: 'name', text: v.no, sub: (v.ahs || []).length ? fill(L.qz_ahSub, { n: v.ahs.map(h => h.no).join(', ') }) : '', weight: 500, color: '#0F766E' },
          { type: 'text', text: v.date, color: '#5B6B6A' }, ...(yt ? [{ type: 'mono', text: v.extNo || '—', color: '#5B6B6A' }] : []), { type: 'text', text: v.due, color: v.late > 0 ? '#B91C1C' : '#172B2A' },
          amt(v.sum), amt(v.ret, '#5B6B6A'), amt(v.paid, '#5B6B6A'), { type: 'text', text: fM(v.left), weight: 600 },
          v.late > 0 ? { type: 'status', text: fill(L.qz_lateV, { n: v.late }), icon: 'clock-alert', fg: '#B91C1C', bg: '#FEF2F2' } : { type: 'text', text: '—', color: '#647574' }] }));

      tFoot = open.length ? { cells: [{ text: fill(L.qz_total, { n: open.length }) }, { text: '' }, ...(yt ? [{ text: '' }] : []), { text: '' }, { text: fM(sm(v => v.sum)) }, { text: fM(sm(v => v.ret)) }, { text: fM(sm(v => v.paid)) }, { text: fM(Lg.debt) }, { text: '' }] } : null;
      tMinWidth = yt ? 1180 : 1060; emptyT = L.qz_noOpenT; emptyD = Lg.advance > 0 ? fill(L.qz_noOpenAdv, { s: fM(Lg.advance) }) : L.qz_noOpenD; emptyIcon = 'circle-check';
    }
    const mvText = m => { const T = { sale: L.qz_m_sale, arch: L.qz_m_arch, rc: L.qz_m_rc, mt: L.qz_m_mt, yt: L.qz_m_yt, qm: L.qz_m_qm, qy: L.qz_m_qy, tripret: L.qz_m_tripret, ah: m.auto ? L.qz_m_ahAuto : L.qz_m_ah }[m.t] || m.t;
      if (m.t === 'mt' || m.t === 'yt') return `${T} · ${L['tl_m_' + m.method] || m.method}`; if (m.base) return `${T} · ${m.base}`; if (m.t === 'ah') return fill(T, { s: fM(m.info) }); return T; };
    if (s.tab === 'moves') {
      tColumns = [{ key: 'no', label: L.qz_c_doc, width: 'minmax(160px,1fr)' }, { key: 'date', label: L.qz_c_date, width: '104px' }, { key: 'txt', label: L.qz_c_what, width: 'minmax(220px,1.4fr)' }, { key: 'dr', label: L.qz_c_dr, width: '136px', align: 'right' }, { key: 'cr', label: L.qz_c_cr, width: '136px', align: 'right' }, { key: 'bal', label: L.qz_c_bal, width: '148px', align: 'right' }];
      let bal = rc.open;
      tRows = [{ id: 'open', onToggle: () => {}, cells: [{ type: 'name', text: L.qz_openBal, sub: fill(L.qz_asOf, { d: s.from }), weight: 600 }, { type: 'text', text: '' }, { type: 'text', text: '' }, { type: 'text', text: '' }, { type: 'text', text: '' }, { type: 'text', text: fM(rc.open), weight: 600 }] },
        ...rc.rows.map((m, i) => { bal = r2(bal + (yt ? m.cr - m.dr : m.dr - m.cr)); return { id: m.no + i, onOpen: () => openDoc(m), onToggle: () => {},
          cells: [{ type: 'name', text: m.no, badge: m.archive ? L.qz_arch : '', sub: '', weight: 500, color: m.archive ? '#172B2A' : '#0D9488' }, { type: 'text', text: m.date, color: '#5B6B6A' }, { type: 'text', text: mvText(m), color: m.t === 'ah' ? '#1D4ED8' : '#172B2A' }, amt(m.dr), amt(m.cr), { type: 'text', text: fM(bal), weight: 500, color: bal < 0 ? '#1D4ED8' : '#172B2A' }] }; })];
      tFoot = { cells: [{ text: L.qz_turnover }, { text: '' }, { text: '' }, { text: fM(rc.dr) }, { text: fM(rc.cr) }, { text: fM(rc.close) }] }; tMinWidth = 960;
    }

      tRows = recons.map(a => { const c = D.reconCalc(K, p.party, br, a.from, a.to), R = RS[a.status] || RS.made; return { id: a.no, onOpen: () => { D.store.reconReq = { open: a.no }; this.nav('recon'); }, onToggle: () => {},
        cells: [{ type: 'mono', text: a.no, color: '#0F766E' }, { type: 'text', text: `${a.from} – ${a.to}`, color: '#5B6B6A' }, { type: 'text', text: fM(c.close), weight: 600 }, { type: 'status', text: L['qz_rs_' + a.status], icon: R[0], fg: R[1], bg: R[2] }, { type: 'text', text: a.createdBy, color: '#5B6B6A' }] }; });
