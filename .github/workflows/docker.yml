name: Docker

# Production image'lari (SPEC 15: GitHub Actions → Docker image → serverda `docker compose pull && up`).
# develop: deploy fayllari o'zgarsa — faqat yig'ish (Dockerfile'lar buzilmaganini tekshirish).
# v* tegi (masalan v1.0.0, main'dan): yig'ish va GHCR'ga joylash — ghcr.io/xudoyberdiyev-dev/medix-{backend,frontend,postgres}.
on:
  push:
    branches: [develop]
    tags: ["v*"]
    paths:
      - backend/Dockerfile
      - frontend/Dockerfile
      - deploy/**
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Image (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend, context: backend }
          - { name: frontend, context: frontend }
          - { name: postgres, context: deploy/postgres }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: GHCR'ga kirish
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Teglar
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/medix-${{ matrix.name }}
          tags: |
            type=semver,pattern=v{{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-
      - name: Yig'ish${{ startsWith(github.ref, 'refs/tags/v') && ' va joylash' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  compose:
    name: Compose fayli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: docker compose config (namuna .env bilan)
        working-directory: deploy
        run: |
          cp .env.example .env
          sed -i 's/^MEDIX_DB_PASSWORD=$/MEDIX_DB_PASSWORD=ci-test/' .env
          docker compose config --quiet
          bash -n backup/backup.sh
          bash -n backup/restore-test.sh
      - name: Caddyfile tekshiruvi
        run: docker run --rm -e MEDIX_DOMAIN=medix.example.uz -e MEDIX_TLS=internal -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2 caddy validate --config /etc/caddy/Caddyfile

  smoke:
    name: Production compose — ishga tushirish, zaxira va tiklash sinovi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Image'lar (mahalliy teg :ci)
        run: |
          docker build -q -t ghcr.io/xudoyberdiyev-dev/medix-postgres:ci deploy/postgres
          docker build -q -t ghcr.io/xudoyberdiyev-dev/medix-backend:ci backend
          docker build -q -t ghcr.io/xudoyberdiyev-dev/medix-frontend:ci frontend
      - name: Ishga tushirish (ichki CA bilan HTTPS)
        working-directory: deploy
        run: |
          cat > .env <<'ENV'
          MEDIX_DOMAIN=localhost
          MEDIX_TLS=internal
          MEDIX_VERSION=ci
          MEDIX_DB_PASSWORD=ci-smoke-parol-1234567890
          MEDIX_BOOTSTRAP_LOGIN=ceo
          MEDIX_BOOTSTRAP_PASSWORD=Smoke-parol-2026
          ENV
          docker compose up -d --pull never
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/api/auth/me || true)
            [ "$code" = "401" ] && break
            sleep 5
          done
          echo "API: $code"; [ "$code" = "401" ]
          curl -skf https://localhost/login -o /dev/null && echo "Login sahifasi: 200"
          code=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/actuator/health); echo "actuator tashqaridan: $code"; [ "$code" != "200" ]
      - name: Zaxira nusxa (pgBackRest full) va tiklash sinovi
        working-directory: deploy
        run: |
          MEDIX_BACKUP_TYPE=full ./backup/backup.sh
          ./backup/restore-test.sh
      - name: Loglar
        if: failure()
        working-directory: deploy
        run: docker compose logs --tail 80
