name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25, Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build va testlar (Testcontainers + PostgreSQL 18)
        run: ./gradlew --no-daemon build
      - name: OpenAPI tavsifi (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/build/openapi/openapi.json
          if-no-files-found: ignore
      - name: OpenAPI frontend bilan mosmi
        run: |
          if ! diff -u ../frontend/lib/api/openapi.json build/openapi/openapi.json; then
            echo "::error::API o'zgardi. Quyidagi tavsifni (yoki 'openapi' artifactini) frontend/lib/api/openapi.json ga ko'chiring va 'pnpm api:gen' ni ishga tushiring."
            echo "----- OPENAPI BEGIN -----"
            cat build/openapi/openapi.json
            echo "----- OPENAPI END -----"
            exit 1
          fi
      - name: Test hisobotlari
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm api:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
