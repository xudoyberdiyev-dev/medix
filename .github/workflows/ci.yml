name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 25, Gradle)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build va testlar (Testcontainers + PostgreSQL 18)
        run: ./gradlew --no-daemon build
      - name: OpenAPI tavsifi (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/build/openapi/openapi.json
          if-no-files-found: ignore
      - name: OpenAPI frontend bilan mosmi
        run: |
          if ! diff -u ../frontend/lib/api/openapi.json build/openapi/openapi.json; then
            echo "::error::API o'zgardi. Quyidagi tavsifni (yoki 'openapi' artifactini) frontend/lib/api/openapi.json ga ko'chiring va 'pnpm api:gen' ni ishga tushiring."
            echo "----- OPENAPI BEGIN -----"
            cat build/openapi/openapi.json
            echo "----- OPENAPI END -----"
            exit 1
          fi
      - name: Test hisobotlari
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm api:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: E2E (Playwright, backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: medix
          POSTGRES_USER: medix
          POSTGRES_PASSWORD: medix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medix" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MEDIX_BOOTSTRAP_LOGIN: ceo
      MEDIX_BOOTSTRAP_PASSWORD: Boshlangich-parol-2026
      MEDIX_COOKIE_SECURE: "false"
      BACKEND_URL: http://localhost:8080
      E2E_CEO_LOGIN: ceo
      E2E_CEO_PASSWORD: Boshlangich-parol-2026
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend jar
        working-directory: backend
        run: ./gradlew --no-daemon bootJar -x test
      - name: Backendni ishga tushirish
        working-directory: backend
        run: |
          nohup java -jar $(ls build/libs/*.jar | grep -v plain | head -1) > ../backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && exit 0
            sleep 2
          done
          cat ../backend.log
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend build va ishga tushirish
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start -p 3000 > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login > /dev/null && exit 0
            sleep 2
          done
          cat ../frontend.log
          exit 1
      - name: Playwright brauzeri
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E testlar
        working-directory: frontend
        run: pnpm e2e
      - name: Loglar
        if: failure()
        run: |
          echo "----- BACKEND -----"; tail -n 200 backend.log || true
          echo "----- FRONTEND -----"; tail -n 100 frontend.log || true
          for f in frontend/test-results/*/error-context.md; do echo "----- $f -----"; cat "$f" || true; done
      - name: Playwright hisoboti
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
