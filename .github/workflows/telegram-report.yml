# Yangi hisobot (reports/*.md) push qilinganda uni Telegram'ga yuboradi.
# Kerakli secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (repo → Settings → Secrets and variables → Actions).
name: Telegram hisobot

on:
  push:
    branches: [develop]
    paths: ["reports/**.md"]
  workflow_dispatch:

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Hisobotni yuborish
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets hali qo'shilmagan — o'tkazib yuborildi."
            exit 0
          fi
          files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'reports/*.md' || true)
          [ -z "$files" ] && files=$(ls -t reports/*.md | head -1)
          for f in $files; do
            # Telegram xabari 4096 belgigacha
            text=$(head -c 3900 "$f")
            curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${CHAT_ID}" \
              --data-urlencode "text=${text}" \
              -d "disable_web_page_preview=true" > /dev/null
            echo "Yuborildi: $f"
          done

