# Sessiya boshlanganda status/last-start.txt yangilanadi → shu matn Telegram'ga yuboriladi.
name: Telegram sessiya boshlandi

on:
  push:
    branches: [develop]
    paths: ["status/last-start.txt"]

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "Telegram secrets hali qo'shilmagan — o'tkazib yuborildi."
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=$(head -c 1000 status/last-start.txt)" > /dev/null
