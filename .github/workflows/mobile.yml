name: mobile
on:
  push:
    branches: [develop, main]
    paths: ["mobile/**", "frontend/i18n/**", ".github/workflows/mobile.yml"]
  pull_request:
    paths: ["mobile/**"]
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Kirill matnlari yangilanganmi
        run: npm run i18n:cyrl && git diff --exit-code messages/uz-Cyrl.json
