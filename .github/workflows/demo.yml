# Egasiga ko'rsatish: to'liq stek (backend + PostgreSQL + frontend) ishga tushiriladi, e2e ma'lumot yaratadi,
# so'ng asosiy sahifalar suratga olinadi. Suratlar log oxirida base64 (DEMO-SHOTS-BEGIN/END) va artifact sifatida.
name: Demo skrinshotlar

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: medix
          POSTGRES_USER: medix
          POSTGRES_PASSWORD: medix
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U medix" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MEDIX_BOOTSTRAP_LOGIN: ceo
      MEDIX_BOOTSTRAP_PASSWORD: Boshlangich-parol-2026
      MEDIX_COOKIE_SECURE: "false"
      BACKEND_URL: http://localhost:8080
      E2E_CEO_LOGIN: ceo
      E2E_CEO_PASSWORD: Boshlangich-parol-2026
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Backend jar
        working-directory: backend
        run: ./gradlew --no-daemon bootJar -x test
      - name: Backendni ishga tushirish
        working-directory: backend
        run: |
          nohup java -jar $(ls build/libs/*.jar | grep -v plain | head -1) > ../backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && exit 0
            sleep 2
          done
          cat ../backend.log
          exit 1
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend build va ishga tushirish
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start -p 3000 > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login > /dev/null && exit 0
            sleep 2
          done
          cat ../frontend.log
          exit 1
      - name: Playwright brauzeri
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E testlar
        working-directory: frontend
        env:
          DEMO_SHOTS: "1"
        run: pnpm e2e
      - name: Suratlarni chiqarish
        if: always()
        run: |
          ls -la /tmp/demo || exit 0
          echo "DEMO-SHOTS-BEGIN"
          tar czf - -C /tmp demo | base64 -w 3000
          echo "DEMO-SHOTS-END"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-skrinshotlar
          path: /tmp/demo
