spring:
  application:
    name: yuzplus
  datasource:
    url: ${YUZPLUS_DB_URL:${MEDIX_DB_URL:jdbc:postgresql://localhost:5432/yuzplus}}
    username: ${YUZPLUS_DB_USER:${MEDIX_DB_USER:yuzplus}}
    password: ${YUZPLUS_DB_PASSWORD:${MEDIX_DB_PASSWORD:yuzplus}}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Tashkent
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */10 * * * *"

server:
  port: ${PORT:8080}
  # Teskari proksi (Caddy) ortida: X-Forwarded-For/Proto ga ishonish — faqat ichki tarmoq proksilari (Tomcat RemoteIpValve)
  forward-headers-strategy: ${YUZPLUS_FORWARD_HEADERS:${MEDIX_FORWARD_HEADERS:none}}
  shutdown: graceful
  servlet:
    session:
      timeout: 10h

yuzplus:
  session:
    cookie-secure: ${YUZPLUS_COOKIE_SECURE:${MEDIX_COOKIE_SECURE:true}}
  bootstrap:
    login: ${YUZPLUS_BOOTSTRAP_LOGIN:${MEDIX_BOOTSTRAP_LOGIN:}}
    password: ${YUZPLUS_BOOTSTRAP_PASSWORD:${MEDIX_BOOTSTRAP_PASSWORD:}}
  employees:
    # Litsenziya: bloklanmagan xodimlar chegarasi (prototip WizStaff «N / 40», egasi E13 — standart 40); 0 — cheklanmagan
    limit: ${YUZPLUS_EMPLOYEE_LIMIT:${MEDIX_EMPLOYEE_LIMIT:40}}
  # orders.late-days → Sozlamalar → Savdo «Buyurtma kechikishi» (app_setting.orderLateDays)
  trips:
    # «Qaytish kutilmoqda»da shuncha soatdan ortiq tursa — Ombor mudiri / kassirga eslatma (T12-audit №23)
    return-wait-hours: 4

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs
