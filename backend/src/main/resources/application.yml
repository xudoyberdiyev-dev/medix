spring:
  application:
    name: medix
  datasource:
    url: ${MEDIX_DB_URL:jdbc:postgresql://localhost:5432/medix}
    username: ${MEDIX_DB_USER:medix}
    password: ${MEDIX_DB_PASSWORD:medix}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Tashkent
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
  session:
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */10 * * * *"

server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 10h

medix:
  session:
    cookie-secure: ${MEDIX_COOKIE_SECURE:true}
  bootstrap:
    login: ${MEDIX_BOOTSTRAP_LOGIN:}
    password: ${MEDIX_BOOTSTRAP_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  default-produces-media-type: application/json
  writer-with-default-pretty-printer: true
  writer-with-order-by-keys: true
  api-docs:
    path: /api/openapi
  swagger-ui:
    path: /api/docs
