# MEDIX — foydalanuvchiga ko'rsatiladigan xato matnlari (o'zbek, lotin). Kalit = ProblemDetail.code.
# Qoida: nima bo'ldi + nima qilish kerak. Texnik kod yo'q. Belgilar: ʻ (U+02BB), ʼ (U+02BC).
error.unexpected=Soʻrov bajarilmadi. Sahifani yangilab, qayta urinib koʻring. Takrorlansa, administratorga xabar bering.
validation.failed=Maʼlumotlarda xato bor. Belgilangan maydonlarni tuzating.
error.notFound=Soʻralgan maʼlumot topilmadi. U oʻchirilgan boʻlishi mumkin — roʻyxatni yangilang.
error.request=Soʻrov notoʻgʻri tuzilgan. Sahifani yangilab, qayta urinib koʻring.
validation.required=Maydon toʻldirilmagan. Qiymatni kiriting.
validation.password.length=Parol 8–128 belgidan iborat boʻlishi kerak. Uzunroq parol tanlang.

auth.unauthorized=Tizimga kirmagansiz yoki sessiya tugagan. Qaytadan kiring.
auth.forbidden=Bu amal uchun ruxsatingiz yoʻq. Administratorga murojaat qiling.
auth.badCredentials=Login yoki parol notoʻgʻri. Tekshirib, qayta kiriting.
auth.blocked=Hisobingiz bloklangan. Administratorga murojaat qiling.
auth.passwordChangeRequired=Davom etishdan oldin parolni almashtiring.
auth.currentPasswordWrong=Joriy parol notoʻgʻri. Tekshirib, qayta kiriting.
auth.passwordSame=Yangi parol joriy paroldan farq qilishi kerak. Boshqa parol tanlang.
auth.csrf=Sahifa eskirgan. Sahifani yangilab, qayta urinib koʻring.
