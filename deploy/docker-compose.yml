# 100+ — production (SPEC 15). Serverda: deploy/ papkasi + .env (namuna: .env.example).
# Ishga tushirish va yangilash: docs/DEPLOY.md
name: yuzplus

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: ghcr.io/xudoyberdiyev-dev/yuzplus-postgres:${YUZPLUS_VERSION:-latest}
    restart: unless-stopped
    environment:
      POSTGRES_DB: yuzplus
      POSTGRES_USER: yuzplus
      POSTGRES_PASSWORD: ${YUZPLUS_DB_PASSWORD:?YUZPLUS_DB_PASSWORD .env da berilmagan}
      TZ: Asia/Tashkent
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest --stanza=yuzplus archive-push %p
      - -c
      - archive_timeout=300
      - -c
      - max_wal_senders=3
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=3GB
      - -c
      - log_timezone=Asia/Tashkent
      - -c
      - timezone=UTC
    volumes:
      - pgdata:/var/lib/postgresql
      - pgbackrest:/var/lib/pgbackrest
      - pgbackrest-spool:/var/spool/pgbackrest
      - ./pgbackrest/conf.d:/etc/pgbackrest/conf.d:ro
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yuzplus -d yuzplus"]
      interval: 10s
      retries: 10
    logging: *logging

  backend:
    image: ghcr.io/xudoyberdiyev-dev/yuzplus-backend:${YUZPLUS_VERSION:-latest}
    restart: unless-stopped
    environment:
      YUZPLUS_DB_URL: jdbc:postgresql://postgres:5432/yuzplus
      YUZPLUS_DB_USER: yuzplus
      YUZPLUS_DB_PASSWORD: ${YUZPLUS_DB_PASSWORD}
      YUZPLUS_COOKIE_SECURE: "true"
      # Caddy ortida: mijoz IP (audit) va https sxemasi X-Forwarded-* dan
      YUZPLUS_FORWARD_HEADERS: native
      YUZPLUS_BOOTSTRAP_LOGIN: ${YUZPLUS_BOOTSTRAP_LOGIN:-}
      YUZPLUS_BOOTSTRAP_PASSWORD: ${YUZPLUS_BOOTSTRAP_PASSWORD:-}
    depends_on:
      postgres: { condition: service_healthy }
    mem_limit: ${YUZPLUS_BACKEND_MEMORY:-2g}
    logging: *logging

  frontend:
    image: ghcr.io/xudoyberdiyev-dev/yuzplus-frontend:${YUZPLUS_VERSION:-latest}
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8080
    depends_on: [backend]
    mem_limit: 1g
    logging: *logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      YUZPLUS_DOMAIN: ${YUZPLUS_DOMAIN:?YUZPLUS_DOMAIN .env da berilmagan}
      YUZPLUS_TLS: ${YUZPLUS_TLS:?YUZPLUS_TLS .env da berilmagan}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [frontend, backend]
    logging: *logging

volumes:
  pgdata:
  pgbackrest:
  pgbackrest-spool:
  caddy-data:
  caddy-config:
