# pgBackRest asosiy sozlamasi. Qo'shimcha (masalan, boshqa joydagi repo2 — S3/MinIO) — conf.d/*.conf orqali.
[global]
repo1-path=/var/lib/pgbackrest
# 4 ta haftalik to'liq nusxa (≈ 1 oy) va ular orasidagi barcha WAL — istalgan daqiqaga tiklash (PITR)
repo1-retention-full=4
compress-type=zst
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
process-max=2
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[medix]
# postgres:18 image'da PGDATA = /var/lib/postgresql/18/docker
pg1-path=/var/lib/postgresql/18/docker
# Superuser — POSTGRES_USER (medix); socket orqali ulanish (local trust)
pg1-user=medix
